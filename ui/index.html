<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retrieval Inspector</title>
<style>
/* ---------------------------------------------------------------- type
   Inter and DM Mono, served from this repo. No CDN, no external request: the
   corpus this indexes may be private, and a page about private documents
   should not announce itself to a font host on load. */
@font-face{font-family:Inter;src:url("/fonts/Inter-400_700.woff2") format("woff2");
  font-weight:400 700;font-display:swap;font-style:normal}
@font-face{font-family:"DM Mono";src:url("/fonts/DMMono-400.woff2") format("woff2");
  font-weight:400;font-display:swap;font-style:normal}
@font-face{font-family:"DM Mono";src:url("/fonts/DMMono-500.woff2") format("woff2");
  font-weight:500;font-display:swap;font-style:normal}

/* ============================================================== tokens
   Light ground, monochrome discipline. The greys are a single neutral ramp so
   nothing competes with the data; the only colour on the page belongs to
   documents, and only to documents that reached an answer.

   Series colours are NOT hand-picked. They are the first three slots of a
   documented categorical palette, validated all-pairs against this page's
   surfaces -- lines can sit anywhere, so an adjacent-only check would hide a
   collapse. Worst CVD dE 9.2, normal vision 24.0. Only three: no ordering of
   more clears the all-pairs floor, so a fourth document folds to grey and is
   identified by its direct label. */
:root{
  --bg:#F4F5F6;
  --panel:#FFFFFF;
  --sunk:#ECEEEF;
  --ink:#000000;
  --near:#111416;
  --soft:#3C4142;
  --muted:#6E7476;
  --faint:#9AA0A2;
  --line:#E2E4E6;
  --rule:#C3C9CC;

  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
  --series-other:#9AA0A2;
  --good:#0ca30c; --critical:#d03b3b; --serious:#b3705f;

  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --max:1240px;
  --pad:clamp(1.25rem,4vw,3.25rem);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.022em;line-height:1.08}
button{font:inherit;color:inherit}

/* The micro-label. Used on every panel, axis and field on the page -- it is
   the single device that makes a screen read as an instrument. */
.lab{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------- masthead
   A folio line, not a navbar: it names the artifact and gets out of the way. */
.folio{border-bottom:1px solid var(--rule);background:var(--panel)}
.folio-in{max-width:var(--max);margin:0 auto;padding:0 var(--pad);height:54px;
  display:flex;align-items:center;gap:22px}
.folio .name{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.folio .rule{flex:1;height:1px;background:var(--rule)}

.seg{display:flex;gap:0}
.seg button{border:0;background:none;padding:6px 0;margin-left:22px;cursor:pointer;
  font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);position:relative;white-space:nowrap}
.seg button:hover{color:var(--soft)}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;
  bottom:-1px;height:1px;background:var(--ink)}
.seg .lock{opacity:.55}

.hint{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
.hint > div{border-top:1px solid var(--line);padding:8px 0;font-size:12.5px;color:var(--muted)}
.hint b{color:var(--serious);font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;margin-right:10px;font-weight:500}

/* ---------------------------------------------------------------- shell */
.wrap{max-width:var(--max);margin:0 auto;padding:34px var(--pad) 96px}

.ask{display:flex;border:1px solid var(--rule);background:var(--panel)}
.ask input{flex:1;min-width:0;padding:16px 18px;border:0;background:none;color:var(--ink);
  font:inherit;font-size:16px;letter-spacing:-.008em}
.ask input:focus{outline:0}
.ask:focus-within{border-color:var(--ink)}
.ask button{border:0;background:var(--ink);color:var(--panel);padding:0 26px;
  font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;cursor:pointer;white-space:nowrap}
.ask button{transition:transform 160ms var(--ease-out),opacity 160ms var(--ease-out)}
.ask button:active{transform:scale(.97)}
.ask button:disabled{opacity:.35;cursor:default}

/* Suggestions: short labels, the full question on hover. */
.sugs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sug{background:none;border:1px solid var(--rule);padding:6px 12px;cursor:pointer;
  font-size:12.5px;color:var(--muted);
  transition:color 160ms var(--ease-out),border-color 160ms var(--ease-out),
             transform 160ms var(--ease-out)}
.sug:hover{color:var(--ink);border-color:var(--ink)}
.sug:active{transform:scale(.97)}
.sug .lab{display:none}

/* --------------------------------------------------------------- panel */
.panel{border:1px solid var(--rule);background:var(--panel);margin-top:24px}
.panel.enter{animation:rise 380ms var(--ease-out) both}
.panel.enter:nth-of-type(2){animation-delay:60ms}
.panel.enter:nth-of-type(3){animation-delay:120ms}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel.enter{animation:none}}
.phead{display:flex;align-items:center;gap:16px;padding:10px 16px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.phead .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.phead button{border:1px solid var(--rule);background:var(--panel);padding:5px 12px;
  font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.13em;
  text-transform:uppercase;cursor:pointer}
.phead button{transition:transform 160ms var(--ease-out),border-color 160ms var(--ease-out)}
.phead button:hover{border-color:var(--ink)}
.phead button:active{transform:scale(.97)}
.phead input[type=range]{width:180px;accent-color:var(--ink)}

#city{display:block;width:100%;height:clamp(360px,42vw,520px)}
.caption{border-top:1px solid var(--line);padding:14px 16px;color:var(--muted);
  font-size:13.5px;min-height:54px}
.caption b{color:var(--ink);font-weight:600}

/* ---------------------------------------------- the answer — the climax */
.answer{border-top:2px solid var(--good)}
.answer.declined{border-top-color:var(--critical)}
.abody{padding:26px 28px}
.verdict{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.verdict .v{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;color:var(--good)}
.answer.declined .verdict .v{color:var(--critical)}
.verdict .score{font-family:var(--mono);font-size:11px;color:var(--faint)}
blockquote{margin:22px 0 0;font-size:30px;line-height:1.34;letter-spacing:-.028em;
  max-width:22em;font-weight:400;color:var(--ink)}
@media (max-width:760px){blockquote{font-size:22px}}
.credit{display:flex;align-items:center;gap:10px;margin-top:16px;
  font-family:var(--mono);font-size:10.5px;color:var(--muted);flex-wrap:wrap;
  letter-spacing:.04em}
.credit i{width:8px;height:8px;flex:none}
.why{margin:16px 0 0;color:var(--muted);font-size:13.5px;max-width:64ch}
.why b{color:var(--soft);font-weight:600}

/* Typographic rows: label, thin rule, value, right-aligned status. */
.rows{margin-top:24px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 76px 1fr 70px;gap:16px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line)}
.row .name{display:flex;align-items:center;gap:9px;font-size:13.5px;min-width:0}
.row .name i{width:8px;height:8px;flex:none}
.row .bar{height:2px;background:var(--sunk);position:relative}
.row .bar i{position:absolute;inset:0 auto 0 0}
.row .n,.row .s{font-family:var(--mono);font-size:10.5px;color:var(--faint);
  letter-spacing:.04em}
.row .s{text-align:right}

details.more{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
details.more > summary{cursor:pointer;list-style:none;font-family:var(--mono);font-size:10px;
  font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"+ "}
details.more[open] > summary::before{content:"\2212 "}
details.more > summary:hover{color:var(--ink)}

/* -------------------------------------------------------------- tables */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-family:var(--mono);font-size:9.5px;font-weight:500;
  text-transform:uppercase;letter-spacing:.13em;color:var(--faint);
  padding:0 14px 8px 0;border-bottom:1px solid var(--rule)}
th.r,td.r{text-align:right;padding-left:20px;padding-right:0}
td{padding:9px 14px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.out{color:var(--faint)}
tr.out .snip{opacity:.6}
.src{white-space:nowrap;font-size:12.5px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;flex:none}
.loc{color:var(--faint);font-size:10px;font-family:var(--mono);margin-top:3px;
  letter-spacing:.04em}
.snip{color:var(--muted);font-size:12px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scroll{overflow-x:auto}

/* ------------------------------------------------------------ settings */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;margin-top:24px}
.grid2 .panel{margin-top:0;border-color:var(--line)}
@media (max-width:960px){.grid2{grid-template-columns:1fr}}
.settings{padding:4px 16px 12px}
.setting{border-bottom:1px solid var(--line);padding:13px 0}
.setting:last-child{border-bottom:0}
.setting .top{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.setting h3{font-size:13px;font-weight:600;letter-spacing:-.008em}
.setting .unit{margin-left:auto}
.opts{display:flex;gap:0}
.opt{background:none;border:0;border-left:1px solid var(--line);padding:3px 12px;
  cursor:pointer;text-align:left;color:var(--faint);display:flex;flex-direction:column;gap:2px}
.opt:first-child{border-left:0;padding-left:0}
.opt:hover{color:var(--soft)}
.opt[aria-pressed="true"]{color:var(--ink)}
.opt .k{font-size:12px;white-space:nowrap}
.opt .v{font-family:var(--mono);font-size:12px;letter-spacing:.02em}
.opt[aria-pressed="true"] .v{font-weight:500}

/* ---------------------------------------------------------- inspection */
.stage{border-bottom:1px solid var(--line)}
.stage:last-child{border-bottom:0}
.stage > summary{cursor:pointer;list-style:none;padding:12px 16px;
  display:grid;grid-template-columns:22px 1fr;gap:14px;align-items:baseline}
.stage > summary::-webkit-details-marker{display:none}
.stage > summary:hover{background:var(--sunk)}
.stage .t{font-size:13px;font-weight:600;letter-spacing:-.008em}
.stage .note{display:block;margin-top:3px}
.stage .body{padding:0 16px 18px 52px}
.stage .body > p{margin:0 0 14px;color:var(--muted);font-size:12.5px;max-width:74ch}

.err{color:var(--critical)}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:760px){
  .folio-in{height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
  .folio .rule{display:none}
  .seg button{margin-left:0;margin-right:20px}
  .sug{grid-template-columns:1fr;gap:3px}
  .row{grid-template-columns:1fr 60px}
  .row .bar,.row .s{display:none}
  .abody{padding:20px}
}
</style>
</head>
<body>

<div class="folio">
  <div class="folio-in">
    <span class="name">Retrieval Inspector</span>
    <span class="rule"></span>
    <div class="seg" role="group" aria-label="Source">
      <button id="src-sample" aria-pressed="true" type="button">Sample corpus</button>
      <button id="src-folder" aria-pressed="false" type="button">Local folder <span class="lock">◇</span></button>
      <button id="src-drive" aria-pressed="false" type="button">Drive <span class="lock">◇</span></button>
    </div>
    <span class="lab" id="readout">loading</span>
  </div>
  <div class="hint hide" id="hint"><div></div></div>
</div>

<div class="wrap">

  <form class="ask" id="form">
    <input id="q" placeholder="Ask a question about these documents" autocomplete="off"
           aria-label="Your question">
    <button id="go" type="submit">Trace</button>
  </form>
  <div class="sugs" id="sugs"></div>

  <section class="panel">
    <div class="phead">
      <span class="lab">The pipeline</span>
      <div class="right">
        <button id="play" type="button">Replay</button>
        <input type="range" id="p" min="0" max="100" value="0" aria-label="Stage">
        <span class="lab num" id="elapsed">idle</span>
      </div>
    </div>
    <canvas id="city"></canvas>
    <div class="caption" id="cap">Every block is a document, every road a path a passage can
      take. Ask something and it lights a route.</div>
  </section>

  <section class="panel answer hide" id="panel-answer">
    <div class="phead"><span class="lab">Answer</span>
      <div class="right"><span class="lab num" id="ansmeta"></span></div></div>
    <div class="abody" id="answer"></div>
  </section>

  <div class="grid2">
    <section class="panel hide" id="panel-settings">
      <div class="phead"><span class="lab">Settings</span>
        <div class="right"><span class="lab">84 labelled cases</span></div></div>
      <div class="settings" id="settings"></div>
      <div class="caption" style="min-height:0;font-size:12px">
        <b>Not wired.</b> The numbers are measured; the controls do not yet re-run retrieval.</div>
    </section>

    <section class="panel hide" id="panel-stages">
      <div class="phead"><span class="lab">Stages</span>
        <div class="right"><span class="lab">nothing dropped</span></div></div>
      <div id="stages"></div>
    </section>
  </div>

</div>

<script type="module">
import { buildCity, buildRun, drawScene, captions, shortDoc } from "/pipeline-map.js";

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nf = n => Number(n).toLocaleString();

/* Parsed PDFs carry <br> where the extractor found a line break. It is real
   text, not markup, and showing it raw makes every passage look broken. */
const clean = s => String(s).replace(/<br\s*\/?>/gi, " ").replace(/\s+/g, " ").trim();

/* Chunks are cut on a token boundary, not a sentence one, so a passage
   routinely starts and ends mid-word. Marking both ends says "a fragment of
   something longer", which is what it is -- unmarked it just looks broken. */
const fragment = s => {
  const t = clean(s);
  if (!t) return t;
  return (/^[A-Z0-9"“(\[]/.test(t) ? "" : "… ") + t + (/[.!?"”)\]]$/.test(t) ? "" : " …");
};

const readInk = () => {
  const cs = getComputedStyle(document.body);
  const v = n => cs.getPropertyValue(n).trim();
  return { ink: v("--ink"), muted: v("--muted"), faint: v("--faint"), line: v("--line"),
    lineSoft: v("--line"), panel: v("--panel"), sunk: v("--sunk"), rule: v("--rule"),
    s1: v("--series-1"), s2: v("--series-2"), s3: v("--series-3"),
    other: v("--series-other"), good: v("--good"), critical: v("--critical") };
};

let CITY = null, RUN = null, INK = readInk(), EVAL = null;
const REPLAY_MS = 8000;

const cv = $("#city"), ctx = cv.getContext("2d");
function size() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { w: r.width, h: r.height };
}
function render() {
  const { w, h } = size();
  drawScene(ctx, CITY, RUN, INK, w, h, Number($("#p").value) / 100);
}
addEventListener("resize", render);
// Webfonts land after first paint; the canvas draws its own labels, so it has
// to be told to redraw or every label stays in the fallback face.
if (document.fonts) document.fonts.ready.then(render);

/* -------------------------------------------------------------- boot */
Promise.all([
  fetch("/api/chunks").then(r => r.json()),
  fetch("/api/corpus").then(r => r.json()),
  fetch("/api/eval").then(r => r.ok ? r.json() : null).catch(() => null),
]).then(([chunks, corpus, evalData]) => {
  CITY = buildCity(chunks); EVAL = evalData;
  $("#readout").textContent = `${nf(corpus.chunks)} chunks / ${corpus.documents} docs`;
  $("#sugs").innerHTML = (corpus.examples || []).map(x =>
    `<button class="sug" type="button" data-q="${esc(x.q)}" title="${esc(x.q)}">${esc(x.label)}</button>`).join("");
  $("#sugs").querySelectorAll(".sug").forEach(b => {
    b.onclick = () => { $("#q").value = b.dataset.q; run(b.dataset.q); };
  });
  render();
}).catch(() => {
  $("#readout").textContent = "server unreachable";
  $("#cap").innerHTML = `<span class="err">Start the server:
    <span class="num">.venv\\Scripts\\python.exe src\\serve.py</span></span>`;
});

/* -------------------------------------------------------- source picker
   Selecting is selecting. The two unbuilt sources say so in one line and never
   become the selection, so the app is never left in a dead state. */
const LOCKED = {
  "src-folder": "Reading a local folder needs a pasted path or drag-and-drop; a browser cannot take a filesystem path from a picker.",
  "src-drive": "Native Google Docs are pointers, not files, so this needs the Drive export path.",
};
for (const id of ["src-sample", "src-folder", "src-drive"]) {
  $("#" + id).onclick = () => {
    const locked = LOCKED[id];
    if (!locked) {
      for (const o of ["src-sample", "src-folder", "src-drive"])
        $("#" + o).setAttribute("aria-pressed", String(o === id));
      $("#hint").classList.add("hide");
      return;
    }
    $("#hint").classList.remove("hide");
    $("#hint").firstElementChild.innerHTML = `<b>not wired</b>${esc(locked)}`;
  };
}

/* --------------------------------------------------------------- run */
$("#form").onsubmit = e => { e.preventDefault(); run($("#q").value.trim()); };

async function run(q) {
  if (!q || !CITY) return;
  $("#go").disabled = true;
  $("#cap").textContent = "Running";
  const t0 = performance.now();
  try {
    const r = await fetch("/api/trace", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    const ms = performance.now() - t0;
    INK = readInk();
    RUN = buildRun(data, CITY, INK);
    $("#elapsed").textContent = `${ms.toFixed(0)}ms · replay ${(REPLAY_MS / ms).toFixed(0)}×`;
    renderAnswer(data); renderSettings(); renderStages(data);
    for (const id of ["panel-answer", "panel-settings", "panel-stages"]) {
      const el = $("#" + id);
      el.classList.remove("hide");
      el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter");
    }
    play();
  } catch (err) {
    $("#cap").innerHTML = `<span class="err">${esc(err.message)}</span>`;
  } finally { $("#go").disabled = false; }
}

/* ---------------------------------------------------------- playback */
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let raf = 0, playing = false;
function setProgress(v, moveSlider = true) {
  v = Math.max(0, Math.min(1, v));     // rAF can hand back a pre-start timestamp
  if (moveSlider) $("#p").value = Math.round(v * 100);
  render();
  if (!RUN) return;
  const caps = captions(RUN);
  if (!caps.length) return;
  const c = caps[Math.max(0, Math.min(caps.length - 1, Math.floor(v * caps.length)))];
  $("#cap").innerHTML = `<b>${esc(c.title)}.</b> ${esc(c.text)}`;
}
function stopPlay() { playing = false; cancelAnimationFrame(raf); $("#play").textContent = "Replay"; }
function play() {
  stopPlay();
  if (reduced()) { setProgress(1); return; }
  playing = true; $("#play").textContent = "Playing";
  const t0 = performance.now();
  const step = now => {
    if (!playing) return;
    const v = Math.min(1, (now - t0) / REPLAY_MS);
    setProgress(v);
    if (v < 1) raf = requestAnimationFrame(step); else stopPlay();
  };
  raf = requestAnimationFrame(step);
}
$("#play").onclick = play;
$("#p").oninput = e => { stopPlay(); setProgress(Number(e.target.value) / 100, false); };

/* ------------------------------------------------------------ answer */
function renderAnswer(data) {
  const v = data.verdict;
  const sel = data.stages[data.stages.length - 1].items;
  const ranked = data.stages.find(s => s.name === "reranked")?.items || [];
  const top = sel[0], ok = v.confident, colour = RUN.colour;

  $("#panel-answer").className = "panel answer" + (ok ? "" : " declined");
  $("#ansmeta").textContent = ok
    ? `${sel.length} passages / ${new Set(sel.map(i => i.source)).size} docs` : "nothing returned";

  /* Which documents answered, and how strongly -- grouped from what survived,
     so it reports what was returned rather than what was merely considered. */
  const byDoc = new Map();
  for (const i of sel) {
    const d = byDoc.get(i.source) || { source: i.source, n: 0, best: -Infinity };
    d.n += 1; d.best = Math.max(d.best, i.score); byDoc.set(i.source, d);
  }
  const docs = [...byDoc.values()].sort((a, b) => b.best - a.best);
  const lo = Math.min(...ranked.map(i => i.score), 0);
  const hi = Math.max(...docs.map(d => d.best), lo + 1);
  /* The bar is scaled within this query, so on a decline -- where every score
     sits far below the threshold -- the best of a bad set would still fill it
     and read as confidence. The numbers already say rejected; the bar is
     dropped rather than allowed to contradict them. */
  const rows = docs.map(d => `
    <div class="row">
      <div class="name"><i style="background:${colour(d.source)}"></i>${esc(shortDoc(d.source))}</div>
      <div class="n">${d.n} psg</div>
      <div class="bar">${ok ? `<i style="width:${Math.max(4, Math.round((d.best - lo) / (hi - lo) * 100))}%;
        background:${colour(d.source)}"></i>` : ""}</div>
      <div class="s">${d.best > 0 ? "+" : ""}${d.best.toFixed(2)}</div>
    </div>`).join("");

  const cand = ranked.map(i => `
    <tr class="${sel.some(s => s.chunk_id === i.chunk_id) ? "" : "out"}">
      <td class="r num">${i.rank}</td>
      <td><div class="src"><span class="dot" style="background:${colour(i.source)}"></span>${esc(shortDoc(i.source))}</div>
          <div class="loc">${esc(i.locator)}</div></td>
      <td><div class="snip">${esc(clean(i.text))}</div></td>
      <td class="r num">${typeof i.score === "number" ? i.score : ""}</td>
      <td class="r num">${i.delta > 0 ? "+" + i.delta : i.delta < 0 ? i.delta : "·"}</td>
    </tr>`).join("");

  $("#answer").innerHTML = `
    <div class="verdict"><span class="v">${ok ? "Answering" : "Declined"}</span>
      <span class="score">${v.confidence > 0 ? "+" : ""}${v.confidence} against threshold ${v.threshold.toFixed(1)}</span>
    </div>
    ${ok ? `
      <blockquote>${esc(fragment(top.text))}</blockquote>
      <div class="credit"><i style="background:${colour(top.source)}"></i>
        ${esc(shortDoc(top.source))} · ${esc(top.locator)}</div>
      <p class="why">Returned <b>verbatim</b>, not summarised, which is why it cannot invent
        anything. Writing these into prose is an optional layer that has never run here for
        want of API credit.</p>
    ` : `
      <blockquote style="font-size:19px">The corpus does not contain this.</blockquote>
      <p class="why">${esc(v.explanation)}</p>
      <p class="why">The passages below came closest and are shown as <b>rejected
        candidates</b>. Returning the nearest topical match to a question the corpus cannot
        answer is the failure this gate exists to prevent.</p>
    `}
    ${docs.length ? `<div class="lab" style="margin-top:26px">${
      ok ? "Documents that answered" : "Closest, and rejected"}</div>
      <div class="rows">${rows}</div>` : ""}
    <details class="more">
      <summary>Every candidate weighed</summary>
      <p class="why">All ${ranked.length} after reranking, in the cross-encoder's order.
        The ${sel.length} that survived the cap are solid; the rest were dropped.</p>
      <div class="scroll"><table>
        <thead><tr><th class="r">#</th><th>Document</th><th>Passage</th>
          <th class="r">Score</th><th class="r">Move</th></tr></thead>
        <tbody>${cand}</tbody></table></div>
    </details>`;
}

/* ---------------------------------------------------------- settings
   Each option carries the number that chose it, read from eval/results.json
   rather than typed here -- a hard-coded 0.848 goes stale the next time the
   harness runs and nobody notices. */
function renderSettings() {
  const e2e = EVAL?.end_to_end || {}, exp = EVAL?.expansion || {};
  const g = (o, k) => (o && o[k] != null ? o[k].toFixed(3) : "—");
  const S = [
    { h: "Reranking", u: "MRR", opts: [
        ["On", g(e2e["dense + rerank"], "mrr")], ["Off", g(e2e["dense, no rerank"], "mrr")]] },
    { h: "Fusion", u: "hit rate", opts: [
        ["RRF", g(e2e["rrf + rerank"], "hit_rate")],
        ["Weighted", g(e2e["weighted + rerank"], "hit_rate")],
        ["Dense", g(e2e["dense + rerank"], "hit_rate")]] },
    { h: "Diversity cap", u: "source recall", opts: [
        ["2/src", g(e2e["+ diversity 2/src"], "src_recall")],
        ["1/src", g(e2e["+ diversity 1/src"], "src_recall")],
        ["None", g(e2e["rrf + rerank"], "src_recall")]] },
    { h: "Context", u: "context recall", opts: [
        ["Window", g(exp["window +/-1"], "context_recall")],
        ["Page", g(exp["page"], "context_recall")],
        ["None", g(exp["none (chunks)"], "context_recall")]] },
  ];
  $("#settings").innerHTML = S.map((s, i) => `
    <div class="setting">
      <div class="top"><h3>${s.h}</h3><span class="lab unit">${s.u}</span></div>
      <div class="opts">${s.opts.map(([k, val], n) => `
        <button class="opt" type="button" aria-pressed="${n === 0}" data-g="${i}">
          <span class="k">${k}</span><span class="v">${val}</span></button>`).join("")}</div>
    </div>`).join("");
  $("#settings").querySelectorAll(".opt").forEach(b => {
    b.onclick = () => $("#settings").querySelectorAll(`.opt[data-g="${b.dataset.g}"]`)
      .forEach(o => o.setAttribute("aria-pressed", String(o === b)));
  });
}

/* -------------------------------------------------------- inspection */
function renderStages(data) {
  $("#stages").innerHTML = data.stages.map((s, n) => `
    <details class="stage">
      <summary><span class="lab num">${String(n + 1).padStart(2, "0")}</span>
        <span><span class="t">${esc(s.title)}</span>
          <span class="lab note">${esc(s.note)}</span></span></summary>
      <div class="body">
        <p>${esc(s.detail)}</p>
        <div class="scroll"><table>
          <thead><tr><th class="r">#</th><th>Document</th><th>Passage</th><th class="r">Score</th></tr></thead>
          <tbody>${s.items.slice(0, 8).map(i => `
            <tr><td class="r num">${i.rank}</td>
              <td><div class="src"><span class="dot" style="background:${RUN.colour(i.source)}"></span>${esc(shortDoc(i.source))}</div>
                  <div class="loc">${esc(i.locator)}</div></td>
              <td><div class="snip">${esc(clean(i.text))}</div></td>
              <td class="r num">${typeof i.score === "number" ? i.score : ""}</td></tr>`).join("")}
          </tbody></table></div>
      </div>
    </details>`).join("");
}
</script>
