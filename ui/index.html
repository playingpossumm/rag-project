<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retrieval</title>
<style>
/* ---------------------------------------------------------------- type
   Inter and DM Mono, served from this repo. No CDN, no external request: the
   corpus this indexes may be private, and a page about private documents
   should not announce itself to a font host on load. That constraint is also
   why the display face is DM Mono rather than a geometric sans -- adding one
   would mean bundling another file, and a monospace headline suits an
   instrument better anyway. */
@font-face{font-family:Inter;src:url("/fonts/Inter-400_700.woff2") format("woff2");
  font-weight:400 700;font-display:swap;font-style:normal}
@font-face{font-family:"DM Mono";src:url("/fonts/DMMono-400.woff2") format("woff2");
  font-weight:400;font-display:swap;font-style:normal}
@font-face{font-family:"DM Mono";src:url("/fonts/DMMono-500.woff2") format("woff2");
  font-weight:500;font-display:swap;font-style:normal}

/* ============================================================== tokens
   Near-black ground, raised cards, generous radius. The three document hues
   are the dark-stepped, all-pairs-validated set (CVD dE 9.4, normal 20.9).

   THE RULE THAT MAKES THE PICTURE READ: colour means "this passage is in your
   answer". Everything else -- every candidate considered and dropped, every
   floor of every tower, the whole index -- is drawn in --wire, a near-invisible
   grey. The previous version tinted everything, so colour meant nothing and
   the diagram read as a chart competing with the answer. */
:root{
  --ground:#0e0e0f;
  --card:#171819;
  --nest:#1f2022;
  --hair:#292b2d;
  --edge:#35383a;

  --ink:#f2f2f0;
  --dim:#a2a5a7;
  --mute:#7c8082;
  --faint:#5a5e60;
  --wire:#43474a;

  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#3fb950; --bad:#f0685f; --warn:#d9a441;

  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --ease:cubic-bezier(.23,1,.32,1);
  --r:14px;
  --max:1120px;
  --pad:clamp(1rem,4vw,2rem);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.6;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--s1);outline-offset:3px;border-radius:4px}

.lab{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.15em;
  text-transform:uppercase;color:var(--faint)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------- topbar */
.top{position:sticky;top:0;z-index:30;background:rgba(14,14,15,.86);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--hair)}
.top-in{max-width:var(--max);margin:0 auto;padding:0 var(--pad);height:56px;
  display:flex;align-items:center;gap:18px}
.brand{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:-.01em}
.brand span{color:var(--faint)}
.top nav{margin-left:auto;display:flex;gap:20px;align-items:center}
.top a{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint);text-decoration:none;
  transition:color 180ms var(--ease)}
.top a:hover{color:var(--ink)}

/* corpus picker: which documents the answers come from. Prominent because
   switching it changes every answer on the page, and a control that silently
   redefines the subject should not be tucked away. */
.picker{position:relative}
.picker>button{display:flex;align-items:center;gap:9px;background:var(--card);
  border:1px solid var(--edge);border-radius:999px;padding:6px 13px 6px 12px;
  cursor:pointer;font-size:13px;color:var(--ink);
  transition:border-color 180ms var(--ease)}
.picker>button:hover{border-color:var(--s1)}
.picker>button .dot{width:6px;height:6px;border-radius:50%;background:var(--s3);flex:none}
.picker>button .caret{width:5px;height:5px;border-right:1.5px solid var(--faint);
  border-bottom:1.5px solid var(--faint);transform:rotate(45deg) translate(-1px,-1px)}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:290px;z-index:40;
  background:var(--card);border:1px solid var(--edge);border-radius:12px;
  padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;
  border-radius:8px;padding:10px 12px;cursor:pointer;
  transition:background 160ms var(--ease)}
.menu button:hover:not(:disabled){background:var(--nest)}
.menu button:disabled{opacity:.4;cursor:default}
.menu .nm{font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:8px}
.menu .nm b{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:500;
  color:var(--faint)}
.menu button[aria-current="true"] .nm{color:var(--s1)}
.menu .sub2{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:3px}
.menu .warn2{color:var(--warn)}
.switching{opacity:.4;pointer-events:none}

.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}

/* --------------------------------------------------------------- hero
   One thing to do, in the middle of the screen. The field lives here until a
   thread exists, then moves to the bottom -- so the page never shows an empty
   conversation with the input parked somewhere else entirely. */
.hero{min-height:calc(100vh - 56px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:40px 0 80px;gap:26px}
.hero h1{font-weight:700;font-size:clamp(32px,5.6vw,60px);line-height:1.02;
  letter-spacing:-.042em;margin:0;max-width:15ch;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--mute)}
.hero p{color:var(--dim);font-size:16px;max-width:52ch;margin:0}
.hero.gone{display:none}
.heroviz{width:100%;max-width:900px;margin:-6px 0 -14px}
.heroviz canvas{display:block;width:100%;height:clamp(230px,30vw,370px)}

/* ------------------------------------------------------------- the field */
.field{width:100%;max-width:660px;display:flex;align-items:flex-end;gap:8px;
  background:var(--card);border:1px solid var(--edge);border-radius:var(--r);
  padding:8px 8px 8px 18px;transition:border-color 180ms var(--ease)}
.field:focus-within{border-color:var(--s1)}
.field textarea{flex:1;min-width:0;border:0;background:none;resize:none;
  padding:12px 0;font-size:16px;line-height:1.5;max-height:160px}
.field textarea:focus{outline:0}
.field textarea::placeholder{color:var(--faint)}
.go{border:0;background:var(--ink);color:var(--ground);border-radius:10px;
  padding:11px 20px;font-family:var(--mono);font-size:11px;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap;
  transition:transform 180ms var(--ease),opacity 180ms var(--ease)}
.go:hover{transform:translateY(-1px)}
.go:active{transform:scale(.97)}
.go:disabled{opacity:.35;cursor:default;transform:none}

.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:680px}
.chip{background:var(--card);border:1px solid var(--hair);border-radius:999px;
  padding:7px 15px;font-size:13px;color:var(--dim);cursor:pointer;
  transition:color 180ms var(--ease),border-color 180ms var(--ease),
             transform 180ms var(--ease)}
.chip:hover{color:var(--ink);border-color:var(--edge);transform:translateY(-1px)}
.chip:active{transform:scale(.97)}

.genrow{display:flex;align-items:center;gap:11px;justify-content:center}
.toggle{display:flex;align-items:center;gap:9px;cursor:pointer;background:none;
  border:0;padding:0;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);transition:color 180ms var(--ease)}
.toggle:hover{color:var(--dim)}
.toggle .sw{width:30px;height:17px;border-radius:999px;background:var(--nest);
  border:1px solid var(--edge);position:relative;flex:none;transition:all 200ms var(--ease)}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;
  border-radius:50%;background:var(--faint);transition:all 200ms var(--ease)}
.toggle[aria-pressed="true"]{color:var(--ink)}
.toggle[aria-pressed="true"] .sw{background:rgba(57,135,229,.22);border-color:var(--s1)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(13px);background:var(--s1)}

/* ------------------------------------------------------------ the thread */
#thread{padding-bottom:30px}
.turn{margin-top:26px;animation:rise 420ms var(--ease) both;scroll-margin-top:74px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.turn{animation:none}}

.q{display:flex;gap:14px;align-items:baseline;padding:0 4px 14px}
.q .t{font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.35;max-width:44ch}

.card{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);
  overflow:hidden}
.card > .pad{padding:clamp(22px,3.4vw,34px)}

.head{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.state{display:inline-flex;align-items:center;gap:8px;border-radius:999px;
  padding:5px 13px 5px 10px;background:rgba(63,185,80,.11);border:1px solid rgba(63,185,80,.3)}
.state .pip{width:6px;height:6px;border-radius:50%;background:var(--good)}
.state .txt{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:var(--good)}
.declined .state{background:rgba(240,104,95,.11);border-color:rgba(240,104,95,.32)}
.declined .state .pip{background:var(--bad)} .declined .state .txt{color:var(--bad)}
.ungated .state{background:rgba(217,164,65,.11);border-color:rgba(217,164,65,.32)}
.ungated .state .pip{background:var(--warn)} .ungated .state .txt{color:var(--warn)}
.head .score{font-family:var(--mono);font-size:11px;color:var(--faint)}
.head .fignum{margin-left:auto;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;color:var(--faint)}

/* the answer is the biggest thing on the page */
.answer{font-size:clamp(18px,2.1vw,22px);line-height:1.52;letter-spacing:-.015em;
  max-width:38em;margin:0;color:var(--ink)}
.answer.prose{font-size:16.5px;line-height:1.68;letter-spacing:-.005em;max-width:64ch}
.answer.prose p{margin:0 0 14px}
.answer.prose p:last-child{margin-bottom:0}
.cite{display:inline-flex;align-items:center;gap:9px;margin-top:18px;
  background:var(--nest);border:1px solid var(--hair);border-radius:999px;
  padding:6px 14px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.cite i{width:7px;height:7px;border-radius:2px;flex:none}
.note{margin:18px 0 0;color:var(--mute);font-size:13.5px;max-width:62ch}
.note b{color:var(--dim);font-weight:600}

.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--nest);
  border:1px solid var(--hair);border-radius:999px;padding:6px 13px;
  font-family:var(--mono);font-size:11px;color:var(--dim)}
.pill i{width:7px;height:7px;border-radius:2px;flex:none}
.pill b{color:var(--ink);font-weight:500}

.warnbox{margin-top:20px;background:var(--nest);border:1px solid var(--hair);
  border-left:2px solid var(--warn);border-radius:8px;padding:14px 17px;
  font-size:13.5px;color:var(--dim)}
.warnbox .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--warn);display:block;margin-bottom:7px}
.warnbox code{font-family:var(--mono);font-size:11.5px;color:var(--mute);word-break:break-word}

/* ------------------------------------------------- the pipeline picture */
.viz{border-top:1px solid var(--hair);background:var(--ground)}
.vizhead{display:flex;align-items:center;gap:14px;padding:14px clamp(22px,3.4vw,34px);
  flex-wrap:wrap}
.vizhead .lab{color:var(--mute)}
.legend{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);
  font-size:10px;color:var(--faint)}
.legend i{width:7px;height:7px;border-radius:2px}
.legend i.w{background:var(--wire)}
canvas.city{display:block;width:100%;height:clamp(280px,32vw,400px)}
.vizfoot{display:flex;align-items:center;gap:14px;
  padding:10px clamp(22px,3.4vw,34px) 18px;flex-wrap:wrap}
.vizfoot .cap{color:var(--mute);font-size:13px;flex:1;min-width:220px;line-height:1.5}
.vizfoot .cap b{color:var(--dim);font-weight:600}
.replay{border:1px solid var(--hair);background:var(--nest);border-radius:999px;
  padding:6px 14px;font-family:var(--mono);font-size:10px;font-weight:500;
  letter-spacing:.11em;text-transform:uppercase;cursor:pointer;color:var(--dim);
  transition:border-color 180ms var(--ease),color 180ms var(--ease)}
.replay:hover{border-color:var(--edge);color:var(--ink)}
.scrub{flex:0 1 180px;accent-color:var(--s1)}

/* ------------------------------------------------------- disclosure rows */
.more{border-top:1px solid var(--hair)}
.more > summary{cursor:pointer;list-style:none;padding:15px clamp(22px,3.4vw,34px);
  display:flex;align-items:center;gap:12px;transition:background 180ms var(--ease)}
.more > summary::-webkit-details-marker{display:none}
.more > summary:hover{background:var(--nest)}
.more > summary .lab{color:var(--dim)}
.more > summary .hint{color:var(--faint);font-size:12.5px}
.more > summary::after{content:"";width:7px;height:7px;margin-left:auto;flex:none;
  border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);
  transform:rotate(45deg) translateY(-2px);transition:transform 220ms var(--ease)}
.more[open] > summary::after{transform:rotate(-135deg) translateY(1px)}
.more .inner{padding:0 clamp(22px,3.4vw,34px) 26px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-family:var(--mono);font-size:9px;font-weight:500;
  text-transform:uppercase;letter-spacing:.13em;color:var(--faint);
  padding:0 12px 9px 0;border-bottom:1px solid var(--hair);white-space:nowrap}
th.r,td.r{text-align:right;padding-left:16px;padding-right:0}
td{padding:10px 12px 10px 0;border-bottom:1px solid var(--hair);vertical-align:top;
  color:var(--dim)}
tr:last-child td{border-bottom:0}
tr.out td{color:var(--faint)}
.src{white-space:nowrap;display:flex;align-items:center;gap:8px;color:var(--ink)}
.dot{width:7px;height:7px;border-radius:2px;flex:none}
.loc{color:var(--faint);font-size:9.5px;font-family:var(--mono);margin-top:3px}
.snip{color:var(--mute);font-size:12px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scroll{overflow-x:auto}
.stage{border-top:1px solid var(--hair);padding:16px 0}
.stage:first-child{border-top:0;padding-top:4px}
.stage h4{margin:0 0 4px;font-size:13.5px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.stage p{margin:9px 0 13px;color:var(--mute);font-size:12.5px;max-width:70ch}

/* ------------------------------------------------------------- settings */
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.set{background:var(--nest);border:1px solid var(--hair);border-radius:10px;padding:14px 16px}
.set .top2{display:flex;align-items:baseline;gap:8px;margin-bottom:11px}
.set h5{margin:0;font-size:12.5px;font-weight:600}
.set .u{margin-left:auto}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--hair);background:var(--card);border-radius:999px;
  padding:5px 11px;cursor:pointer;color:var(--faint);display:flex;align-items:baseline;
  gap:6px;transition:color 180ms var(--ease),border-color 180ms var(--ease),
  background 180ms var(--ease)}
.opt:hover{color:var(--dim);border-color:var(--edge)}
.opt[aria-pressed="true"]{color:var(--ink);border-color:var(--s1);
  background:rgba(57,135,229,.12)}
.opt .k{font-size:12px;white-space:nowrap}
.opt .v{font-family:var(--mono);font-size:10.5px;opacity:.75}
.cmp{margin-top:16px;background:var(--nest);border:1px solid var(--hair);
  border-radius:10px;padding:14px 16px;font-size:13px;color:var(--dim)}
.cmp table{margin-top:10px;max-width:460px}

/* ------------------------------------------------------------- composer */
.dock{position:sticky;bottom:0;z-index:20;padding:14px 0 20px;
  background:linear-gradient(to top,var(--ground) 66%,transparent)}
.dock.hide{display:none}
.dock .field{max-width:none}
.dock .genrow{justify-content:flex-start;margin-top:10px;padding-left:4px}

.thinking{display:flex;align-items:center;gap:14px;padding:34px clamp(22px,3.4vw,34px);
  font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint)}
.thinking .bar{width:84px;height:2px;background:var(--hair);overflow:hidden;border-radius:2px}
.thinking .bar::after{content:"";display:block;width:36%;height:100%;background:var(--s1);
  animation:slide 1.15s var(--ease) infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
.err{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <span class="brand">retrieval<span>/</span></span>
  <nav>
    <a href="/quality">Quality</a>
    <a href="/~/architecture">Architecture</a>
    <span class="lab" id="readout">loading</span>
    <span class="picker" id="picker">
      <button type="button" id="pickBtn" aria-haspopup="true" aria-expanded="false">
        <span class="dot"></span><span id="pickName">corpus</span><span class="caret"></span>
      </button>
      <div class="menu" id="pickMenu" hidden role="menu"></div>
    </span>
  </nav>
</div></header>

<div class="wrap">
  <section class="hero" id="hero">
    <h1>Ask your documents.<br><em>See how it answered.</em></h1>
    <p>It searches your files two ways at once, picks the passages that fit best, and
      shows you each step. If the answer is not in there, it says so instead of
      guessing.</p>
    <div class="heroviz"><canvas id="idle"></canvas></div>
    <form class="field" id="form">
      <textarea id="q" rows="1" placeholder="Ask something about your documents"
                aria-label="Your question"></textarea>
      <button class="go" id="goBtn" type="submit">Ask</button>
    </form>
    <div class="chips" id="chips"></div>
    <div class="genrow" id="genrow">
      <button class="toggle" id="gen" type="button" aria-pressed="false">
        <span class="sw"></span><span>Write it out as prose</span></button>
      <span class="lab" id="genhint">off · you get the passage itself</span>
    </div>
  </section>

  <div id="thread"></div>
  <div class="dock hide" id="dock"></div>
</div>

<script type="module">
import { buildCity, buildRun, drawScene, captions, shortDoc } from "/pipeline-map.js";

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nf = n => Number(n).toLocaleString();

/* The parser emits Markdown, so a passage carries the extractor's own marks:
   <br> where it found a line break, ### where it inferred a heading, ** around
   what looked bold. None of that is in the document -- it is how the text was
   recovered -- so stripping it removes the extractor's marks, never the
   document's words. */
const clean = s => String(s)
  .replace(/<br\s*\/?>/gi, " ")
  .replace(/^#{1,6}\s+/gm, "")
  .replace(/#{2,6}\s+/g, "")
  .replace(/\*\*(.+?)\*\*/g, "$1")
  .replace(/(^|\s)[*_]{1,2}(?=\S)|(?<=\S)[*_]{1,2}(?=\s|$)/g, "$1")
  .replace(/\s+/g, " ").trim();

/* Chunks are cut on a token boundary, so a passage routinely starts and ends
   mid-sentence. Marking both ends says "a fragment of something longer". */
const fragment = s => {
  const t = clean(s);
  if (!t) return t;
  return (/^[A-Z0-9"“(\[]/.test(t) ? "" : "… ") + t + (/[.!?"”)\]]$/.test(t) ? "" : " …");
};

/* `other` is --wire, not a mid grey: everything that did NOT reach the answer
   is drawn as near-invisible wireframe, so hue in the picture means exactly
   one thing. */
const readInk = () => {
  const cs = getComputedStyle(document.body);
  const v = n => cs.getPropertyValue(n).trim();
  return { ink: v("--ink"), muted: v("--mute"), faint: v("--wire"), line: v("--hair"),
    lineSoft: v("--hair"), panel: v("--ground"), sunk: v("--card"), rule: v("--hair"),
    s1: v("--s1"), s2: v("--s2"), s3: v("--s3"),
    other: v("--wire"), good: v("--good"), critical: v("--bad") };
};

let CITY = null, EVAL = null, INK = readInk(), N = 0, BUSY = false, GENERATE = false;
let ACTIVE = null;
const REPLAY_MS = 7000;
const DEFAULTS = { rerank: true, fusion: "rrf", max_per_source: 2, expansion: "window" };
let BASELINE = null;

/* ---------------------------------------------------------------- boot */
/* Everything below the corpus depends on the corpus: the index drawing, the
   example questions, and the score the gate compares against. Switching one
   therefore reloads all of it rather than patching a label. */
async function loadCorpus() {
  const [chunks, corpus, evalData] = await Promise.all([
    fetch("/api/chunks").then(r => r.json()),
    fetch("/api/corpus").then(r => r.json()),
    fetch("/api/eval").then(r => r.ok ? r.json() : null).catch(() => null),
  ]);
  CITY = buildCity(chunks); EVAL = evalData; ACTIVE = corpus.active || null;
  $("#readout").textContent = `${nf(corpus.chunks)} chunks · ${corpus.documents} docs`;
  $("#chips").innerHTML = (corpus.examples || []).map(x =>
    `<button class="chip" type="button" data-q="${esc(x.q)}">${esc(x.label)}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b => {
    b.onclick = () => { $("#q").value = b.dataset.q; submit(); };
  });
  if (ACTIVE) $("#pickName").textContent = ACTIVE.label;
  drawIdle();
}

Promise.all([loadCorpus(), loadPicker()]).then(() => {
  addEventListener("resize", drawIdle);
}).catch(() => {
  $("#readout").textContent = "server unreachable";
  $("#hero").insertAdjacentHTML("beforeend",
    `<p class="err">Start the server: <span class="num">.venv\\Scripts\\python.exe src\\serve.py</span></p>`);
});

/* The corpus at rest: every block and road already there, nothing lit. Passing
   a null run draws the city with no query, which is exactly the state the
   layout was designed around -- structure exists before the question. */
function drawIdle() {
  const cv = $("#idle");
  if (!cv || !CITY || $("#hero").classList.contains("gone")) return;
  const ctx = cv.getContext("2d");
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  if (!r.width) return;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Brighter wire here than inside an answer: on the hero this drawing IS the
  // subject, whereas in a card it is the quiet ground that lets the coloured
  // survivors read.
  drawScene(ctx, CITY, null, { ...INK, faint: "#6a6f72", other: "#6a6f72" },
            r.width, r.height, 1);
}

/* -------------------------------------------------------- corpus picker
   The threshold is shown per corpus because it is not one number: the same
   0.0 refuses 1.5% of answerable questions on the ML papers, 38.5% on the
   bird corpus and 54.3% on the finance one. A corpus nobody has calibrated
   says so rather than quietly borrowing another's. */
async function loadPicker() {
  const data = await fetch("/api/corpora").then(r => r.json()).catch(() => null);
  if (!data) return;
  $("#pickMenu").innerHTML = data.corpora.map(c => `
    <button type="button" data-name="${esc(c.name)}" ${c.indexed ? "" : "disabled"}
            aria-current="${c.name === data.active}">
      <span class="nm">${esc(c.label)}<b>${c.name === data.active ? "in use" : ""}</b></span>
      <span class="sub2 ${c.calibrated ? "" : "warn2"}">${
        c.indexed
          ? (c.calibrated
              ? `refuses below ${c.threshold > 0 ? "+" : ""}${c.threshold.toFixed(1)}`
              : "not calibrated · borrowing 0.0")
          : "no index built"}</span>
    </button>`).join("");
  $("#pickMenu").querySelectorAll("button[data-name]").forEach(b => {
    b.onclick = () => selectCorpus(b.dataset.name);
  });
}

async function selectCorpus(name) {
  if (BUSY || (ACTIVE && name === ACTIVE.name)) { closeMenu(); return; }
  closeMenu();
  document.body.classList.add("switching");
  try {
    const r = await fetch("/api/corpus/select", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    // The thread is cleared, not kept. Answers already on the page came from
    // different documents under a different threshold, and leaving them under a
    // new corpus name would attribute them to documents that never saw the
    // question.
    $("#thread").innerHTML = "";
    N = 0; BASELINE = null;
    $("#hero").classList.remove("gone");
    $("#dock").classList.add("hide");
    $("#hero").append($("#form"), $("#genrow"));
    await Promise.all([loadCorpus(), loadPicker()]);
  } catch (err) {
    $("#readout").textContent = err.message;
  } finally {
    document.body.classList.remove("switching");
  }
}

const closeMenu = () => {
  $("#pickMenu").hidden = true;
  $("#pickBtn").setAttribute("aria-expanded", "false");
};
$("#pickBtn").onclick = e => {
  e.stopPropagation();
  const open = $("#pickMenu").hidden;
  $("#pickMenu").hidden = !open;
  $("#pickBtn").setAttribute("aria-expanded", String(open));
};
addEventListener("click", closeMenu);
addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
$("#pickMenu").onclick = e => e.stopPropagation();

/* ------------------------------------------------------------ composer */
const ta = $("#q");
const grow = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };
ta.addEventListener("input", grow);
ta.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
});
$("#form").onsubmit = e => { e.preventDefault(); submit(); };
$("#gen").onclick = () => {
  GENERATE = !GENERATE;
  $("#gen").setAttribute("aria-pressed", String(GENERATE));
  $("#genhint").textContent = GENERATE
    ? "on · needs credit, falls back to the passage"
    : "off · you get the passage itself";
};

function submit() {
  const q = ta.value.trim();
  if (!q || BUSY || !CITY) return;
  ta.value = ""; grow();
  // The field starts centred on an empty screen because it is the only thing
  // to do; once a thread exists it belongs at the bottom, where the next
  // question goes.
  if (!N) {
    $("#hero").classList.add("gone");
    const dock = $("#dock");
    dock.append($("#form"), $("#genrow"));
    dock.classList.remove("hide");
  }
  ask(q);
}

/* ------------------------------------------------------------ one turn */
async function ask(question, opts = DEFAULTS, into = null) {
  BUSY = true; $("#goBtn").disabled = true;
  const fresh = !into;
  const turn = into || newTurn(question);
  const t0 = performance.now();
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, generate: GENERATE, ...opts }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    data.ms = performance.now() - t0;
    if (fresh) BASELINE = data;
    INK = readInk();
    // Re-running rebuilds the card, which would snap every disclosure shut --
    // closing the Settings panel you changed a setting in, hiding the
    // comparison you had just asked for.
    const open = [...turn.querySelectorAll("details")].map(d => d.open);
    renderTurn(turn, question, data, opts);
    const now = turn.querySelectorAll("details");
    open.forEach((o, i) => { if (now[i]) now[i].open = o; });
    if (fresh) turn.scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (err) {
    turn.querySelector(".slot").innerHTML =
      `<div class="thinking err">${esc(err.message)}</div>`;
  } finally { BUSY = false; $("#goBtn").disabled = false; }
}

function newTurn(question) {
  N += 1;
  const el = document.createElement("section");
  el.className = "turn";
  el.innerHTML = `
    <div class="q"><span class="lab" style="padding-top:6px">You</span>
      <span class="t">${esc(question)}</span></div>
    <div class="card"><div class="slot">
      <div class="thinking"><span class="bar"></span>looking through ${nf(CITY.total)} passages</div>
    </div></div>`;
  $("#thread").appendChild(el);
  return el;
}

/* ------------------------------------------------------------ the card */
function renderTurn(turn, question, data, opts) {
  const v = data.verdict;
  const sel = data.stages[data.stages.length - 1].items;
  const rr = data.stages.find(s => s.name === "reranked");
  const ranked = (rr?.items?.length ? rr.items
    : data.stages.find(s => s.name === "fused")?.items) || [];
  const run = buildRun(data, CITY, INK);
  const colour = run.colour;
  const gated = v.gated !== false;
  turn.className = "turn " + (!gated ? "ungated" : v.confident ? "" : "declined");

  const scores = sel.map(i => i.score).filter(n => typeof n === "number");
  const dp = scores.length && Math.max(...scores.map(Math.abs)) < 1 ? 4 : 2;
  const sig = n => (n > 0 ? "+" : "") + Number(n).toFixed(dp);

  const byDoc = new Map();
  for (const i of sel) {
    const d = byDoc.get(i.source) || { source: i.source, n: 0, best: -Infinity };
    d.n += 1; d.best = Math.max(d.best, i.score); byDoc.set(i.source, d);
  }
  const docs = [...byDoc.values()].sort((a, b) => b.best - a.best);
  const top = sel[0];
  const gen = data.generation || { state: "off" };

  const label = !gated ? "Can't tell" : v.confident ? "Answered" : "Not in your files";
  const score = !gated
    ? "no confidence score on this setting, so it cannot judge itself"
    : `${sig(v.confidence)} · it needs ${v.threshold.toFixed(1)} to answer at all`;

  const answerHTML = gen.state === "ok"
    ? `<div class="answer prose">${gen.text.split(/\n{2,}/)
        .map(p => `<p>${esc(p.trim())}</p>`).join("")}</div>`
    : v.confident === false
      ? `<p class="answer">Your files do not cover this.</p>`
      : `<p class="answer">${esc(fragment(top ? top.text : ""))}</p>`;

  turn.querySelector(".slot").innerHTML = `
    <div class="pad">
      <div class="head">
        <span class="state"><span class="pip"></span><span class="txt">${label}</span></span>
        <span class="score">${esc(score)}</span>
        <span class="fignum">FIG.${String(N).padStart(2, "0")}</span>
      </div>
      ${answerHTML}
      ${top && v.confident !== false ? `<div class="cite">
        <i style="background:${colour(top.source)}"></i>
        ${esc(shortDoc(top.source))} · ${esc(top.locator)}</div>` : ""}
      ${gen.state === "unavailable" ? `<div class="warnbox">
        <span class="k">could not write it out</span>
        It could not write this one out, so you are getting the passage itself.
        That is the normal fallback, not a failure.
        <br><code>${esc(gen.reason || "")}</code></div>` : ""}
      ${v.confident === false
        ? `<p class="note">The closest matches are below, but none of them actually
           answer the question. Handing you the nearest thing it found would be
           <b>worse than saying nothing</b>.</p>`
        : gen.state === "ok"
          ? `<p class="note">Written using only the ${sel.length} passages below. Every
             claim shows the file it came from.</p>`
          : `<p class="note">This is the text from your file, <b>word for word</b>.
             Nothing was rewritten, so nothing can be made up.</p>`}
      <div class="pills">
        ${docs.map(d => `<span class="pill"><i style="background:${colour(d.source)}"></i>
          ${esc(shortDoc(d.source))} <b>${d.n}</b></span>`).join("")}
        <span class="pill">${data.ms.toFixed(0)}<b>ms</b></span>
        ${data.context ? `<span class="pill">${nf(data.context.chars)}<b>chars</b></span>` : ""}
      </div>
    </div>

    <div class="viz">
      <div class="vizhead"><span class="lab">How it found this</span>
        <span class="legend">
          <span><i style="background:${colour(docs[0]?.source || "")}"></i>used</span>
          <span><i class="w"></i>looked at, not used</span>
        </span>
      </div>
      <canvas class="city"></canvas>
      <div class="vizfoot">
        <span class="cap"></span>
        <input type="range" class="scrub" min="0" max="100" value="100" aria-label="Stage">
        <button class="replay" type="button">Replay</button>
      </div>
    </div>

    <details class="more"><summary><span class="lab">Candidates</span>
      <span class="hint">${ranked.length} looked at, ${sel.length} used</span></summary>
      <div class="inner"><div class="scroll"><table>
        <thead><tr><th class="r">#</th><th>Document</th><th>Passage</th>
          <th class="r">Score</th><th class="r">Move</th></tr></thead>
        <tbody>${ranked.map(i => `
          <tr class="${sel.some(s => s.chunk_id === i.chunk_id) ? "" : "out"}">
            <td class="r num">${i.rank}</td>
            <td><div class="src"><span class="dot" style="background:${colour(i.source)}"></span>${esc(shortDoc(i.source))}</div>
                <div class="loc">${esc(i.locator)}</div></td>
            <td><div class="snip">${esc(clean(i.text))}</div></td>
            <td class="r num">${typeof i.score === "number" ? sig(i.score) : ""}</td>
            <td class="r num">${i.delta > 0 ? "+" + i.delta : i.delta < 0 ? i.delta : "·"}</td>
          </tr>`).join("")}</tbody></table></div></div>
    </details>

    <details class="more"><summary><span class="lab">Each step</span>
      <span class="hint">what happened, in order</span></summary>
      <div class="inner">${data.stages.map((s, n) => `
        <div class="stage"><h4>${String(n + 1).padStart(2, "0")} · ${esc(s.title)}</h4>
          <span class="lab">${esc(s.skipped || s.note)}</span>
          <p>${esc(s.detail)}</p>
          ${s.items.length ? `<div class="scroll"><table>
            <thead><tr><th class="r">#</th><th>Document</th><th>Passage</th><th class="r">Score</th></tr></thead>
            <tbody>${s.items.slice(0, 6).map(i => `
              <tr><td class="r num">${i.rank}</td>
                <td><div class="src"><span class="dot" style="background:${colour(i.source)}"></span>${esc(shortDoc(i.source))}</div>
                    <div class="loc">${esc(i.locator)}</div></td>
                <td><div class="snip">${esc(clean(i.text))}</div></td>
                <td class="r num">${typeof i.score === "number" ? i.score : ""}</td></tr>`).join("")}
            </tbody></table></div>` : ""}
        </div>`).join("")}</div>
    </details>

    <details class="more"><summary><span class="lab">Settings</span>
      <span class="hint">change one and this question runs again</span></summary>
      <div class="inner"><div class="sets">${settingsHTML(opts)}</div>
        <div class="cmp"></div></div>
    </details>`;

  wireCity(turn, run, data);
  wireSettings(turn, question, opts);
  renderCompare(turn, data, opts);
}

/* ---------------------------------------------------------- the picture */
function wireCity(turn, run, data) {
  const cv = turn.querySelector("canvas.city"), ctx = cv.getContext("2d");
  const scrub = turn.querySelector(".scrub"), btn = turn.querySelector(".replay");
  const cap = turn.querySelector(".cap");
  let raf = 0, playing = false;

  const render = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const r = cv.getBoundingClientRect();
    if (!r.width) return;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawScene(ctx, CITY, run, INK, r.width, r.height, Number(scrub.value) / 100);
  };
  const at = (t, move = true) => {
    t = Math.max(0, Math.min(1, t));
    if (move) scrub.value = Math.round(t * 100);
    render();
    const caps = captions(run);
    if (!caps.length) return;
    const c = caps[Math.max(0, Math.min(caps.length - 1, Math.floor(t * caps.length)))];
    cap.innerHTML = `<b>${esc(c.title)}.</b> ${esc(c.text)}`;
  };
  const stop = () => { playing = false; cancelAnimationFrame(raf); btn.textContent = "Replay"; };
  const play = () => {
    stop();
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { at(1); return; }
    playing = true; btn.textContent = "Playing";
    const t0 = performance.now();
    const step = now => {
      if (!playing) return;
      const t = Math.min(1, (now - t0) / REPLAY_MS);
      at(t);
      if (t < 1) raf = requestAnimationFrame(step); else stop();
    };
    raf = requestAnimationFrame(step);
  };
  btn.onclick = play;
  scrub.oninput = e => { stop(); at(Number(e.target.value) / 100, false); };
  addEventListener("resize", render);
  if (document.fonts) document.fonts.ready.then(render);
  at(1);
  play();
}

/* ------------------------------------------------------------- settings */
const g = (o, k) => (o && o[k] != null ? o[k].toFixed(3) : "—");
function settingsHTML(opts) {
  const e2e = EVAL?.end_to_end || {}, exp = EVAL?.expansion || {};
  const S = [
    { h: "Reranking", u: "MRR", key: "rerank", opts: [
      ["On", true, g(e2e["dense + rerank"], "mrr")],
      ["Off", false, g(e2e["dense, no rerank"], "mrr")]] },
    { h: "Fusion", u: "hit rate", key: "fusion", opts: [
      ["RRF", "rrf", g(e2e["rrf + rerank"], "hit_rate")],
      ["Weighted", "weighted", g(e2e["weighted + rerank"], "hit_rate")],
      ["Dense", "none", g(e2e["dense + rerank"], "hit_rate")]] },
    { h: "Diversity cap", u: "source recall", key: "max_per_source", opts: [
      ["2/src", 2, g(e2e["+ diversity 2/src"], "src_recall")],
      ["1/src", 1, g(e2e["+ diversity 1/src"], "src_recall")],
      ["None", null, g(e2e["rrf + rerank"], "src_recall")]] },
    { h: "Context", u: "context recall", key: "expansion", opts: [
      ["Window", "window", g(exp["window +/-1"], "context_recall")],
      ["Page", "page", g(exp["page"], "context_recall")],
      ["None", "none", g(exp["none (chunks)"], "context_recall")]] },
  ];
  return S.map(s => `
    <div class="set" data-key="${s.key}">
      <div class="top2"><h5>${s.h}</h5><span class="lab u">${s.u}</span></div>
      <div class="opts">${s.opts.map(([k, val, num]) => `
        <button class="opt" type="button" data-val='${JSON.stringify(val)}'
          aria-pressed="${JSON.stringify(val) === JSON.stringify(opts[s.key])}">
          <span class="k">${k}</span><span class="v">${num}</span></button>`).join("")}</div>
    </div>`).join("");
}

function wireSettings(turn, question, opts) {
  turn.querySelectorAll(".set").forEach(cell => {
    cell.querySelectorAll(".opt").forEach(b => {
      b.onclick = () => {
        if (BUSY) return;
        ask(question, { ...opts, [cell.dataset.key]: JSON.parse(b.dataset.val) }, turn);
      };
    });
  });
}

function renderCompare(turn, data, opts) {
  const box = turn.querySelector(".cmp");
  if (!box) return;
  if (JSON.stringify(opts) === JSON.stringify(DEFAULTS) || !BASELINE) {
    box.innerHTML = `<span class="lab">defaults</span> These are the settings it
      normally uses. Change one and the question runs again, showing only what moved.`;
    return;
  }
  const ids = s => new Set(s.stages[s.stages.length - 1].items.map(i => i.chunk_id));
  const a = ids(BASELINE), b = ids(data);
  const added = [...b].filter(i => !a.has(i)).length;
  const rows = [];
  if (added) rows.push(["passages", `${a.size}`, `${b.size} · ${added} new`]);
  const av = BASELINE.verdict, bv = data.verdict;
  if (av.confidence !== bv.confidence)
    rows.push(["confidence",
      av.gated === false ? "no gate" : `${av.confidence > 0 ? "+" : ""}${av.confidence}`,
      bv.gated === false ? "no gate" : `${bv.confidence > 0 ? "+" : ""}${bv.confidence}`]);
  if (BASELINE.context && data.context && BASELINE.context.chars !== data.context.chars)
    rows.push(["context", `${nf(BASELINE.context.chars)} ch`, `${nf(data.context.chars)} ch`]);
  rows.push(["took", `${BASELINE.ms.toFixed(0)} ms`, `${data.ms.toFixed(0)} ms`]);

  box.innerHTML = `<span class="lab">defaults vs now</span>
    <table><thead><tr><th></th><th class="r">default</th><th class="r">now</th></tr></thead>
    <tbody>${rows.map(([k, x, y]) =>
      `<tr><td>${esc(k)}</td><td class="r num">${esc(x)}</td><td class="r num">${esc(y)}</td></tr>`
    ).join("")}</tbody></table>
    ${rows.length <= 1 ? `<p class="lab" style="margin-top:12px">same passages, same
      order. this setting made no difference here</p>` : ""}`;
}
</script>
</body>
</html>
