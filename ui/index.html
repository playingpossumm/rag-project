<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retrieval Inspector</title>
<style>
/* ============================================================== tokens
   Series colours are NOT hand-picked. They are the first three slots of a
   documented categorical palette, validated with the all-pairs check against
   the two surfaces below -- lines can sit anywhere, so an adjacent-only check
   would hide a collapse. Worst CVD dE 9.2 light / 9.4 dark; normal-vision
   24.0 / 20.9. Only three: no ordering of more clears the all-pairs floor, so
   a fourth document folds to grey and is identified by its direct label. */
:root{
  --ground:#F6F7F9; --panel:#FFFFFF; --sunk:#EDEFF3;
  --ink:#151A21; --muted:#5D6875; --faint:#8A94A1;
  --line:#DFE3E9; --line-soft:#EAEDF1;
  --grid:#E1E0D9; --baseline:#C3C2B7;

  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
  --series-other:#8A94A1;

  /* Status is fixed, never themed, and never reused for a series. */
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;

  --shadow:0 1px 2px rgba(20,26,34,.05),0 8px 24px -12px rgba(20,26,34,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1216; --panel:#151A20; --sunk:#1B2128;
    --ink:#E7EBEF; --muted:#95A0AD; --faint:#6C7885;
    --line:#242C35; --line-soft:#1E252D;
    --grid:#2C2C2A; --baseline:#383835;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
    --series-other:#6C7885;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1216; --panel:#151A20; --sunk:#1B2128;
  --ink:#E7EBEF; --muted:#95A0AD; --faint:#6C7885;
  --line:#242C35; --line-soft:#1E252D;
  --grid:#2C2C2A; --baseline:#383835;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
  --series-other:#6C7885;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55;
}
.mono{font-family:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
      font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:620; letter-spacing:-.011em}

.wrap{max-width:1180px; margin:0 auto; padding:0 28px 96px}
header{border-bottom:1px solid var(--line); background:var(--panel)}
.head-in{max-width:1180px; margin:0 auto; padding:22px 28px 0;
  display:flex; align-items:flex-start; gap:24px; flex-wrap:wrap}
.brand{flex:1 1 320px; min-width:0}
.brand h1{font-size:20px; display:flex; align-items:center; gap:10px}
.brand p{margin:5px 0 0; color:var(--muted); font-size:13.5px; max-width:62ch}
.spark{width:26px;height:14px;flex:none;color:var(--series-1)}
.themer{border:1px solid var(--line); background:var(--panel); color:var(--muted);
  border-radius:7px; padding:7px 12px; font:inherit; font-size:12.5px; cursor:pointer}
.themer:hover{color:var(--ink); border-color:var(--faint)}

.views{display:flex; gap:2px; width:100%; margin-top:18px}
.view-btn{border:0; border-bottom:2px solid transparent; background:none;
  color:var(--muted); font:inherit; font-size:14px; font-weight:560;
  padding:9px 15px; cursor:pointer}
.view-btn[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--series-1)}
.view-btn:hover{color:var(--ink)}
.view-btn:focus-visible{outline:2px solid var(--series-1); outline-offset:2px}

.query{display:flex; gap:10px; width:100%; margin:22px 0 0}
.query input{flex:1; padding:13px 15px; border:1px solid var(--line); border-radius:9px;
  background:var(--ground); color:var(--ink); font:inherit; min-width:0}
.query input:focus{outline:2px solid var(--series-1); outline-offset:-1px; border-color:transparent}
.btn{padding:13px 22px; border:0; border-radius:9px; background:var(--ink);
  color:var(--ground); font:inherit; font-weight:600; cursor:pointer; white-space:nowrap}
.btn:hover{opacity:.87}
.btn:disabled{opacity:.45; cursor:default}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line)}
.examples{display:flex; gap:7px; flex-wrap:wrap; margin:11px 0 22px; width:100%}
.examples span{color:var(--faint); font-size:12px; padding:4px 0}
.chip{border:1px solid var(--line); background:transparent; color:var(--muted);
  border-radius:20px; padding:4px 11px; font:inherit; font-size:12px; cursor:pointer}
.chip:hover{border-color:var(--series-1); color:var(--series-1)}

.stack{padding-top:30px}
.stale{opacity:.45; transition:opacity .15s}

.verdict{display:flex; gap:18px; align-items:stretch; flex-wrap:wrap;
  background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--good);
  border-radius:11px; padding:18px 20px; margin-bottom:26px; box-shadow:var(--shadow)}
.verdict.abstain{border-left-color:var(--critical)}
.v-main{flex:1 1 380px; min-width:0}
.v-tag{font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  font-weight:700; color:var(--good); display:flex; align-items:center; gap:6px}
.verdict.abstain .v-tag{color:var(--critical)}
.v-main p{margin:6px 0 0; color:var(--muted); font-size:13.5px}
.v-docs{margin-top:10px; display:flex; gap:6px; flex-wrap:wrap}
.doc-pill{font-size:11.5px; padding:3px 9px; border-radius:5px;
  background:var(--sunk); border:1px solid var(--line-soft)}
.doc-pill i{display:inline-block;width:8px;height:8px;border-radius:2px;
  margin-right:6px;vertical-align:0}
.gauge{flex:0 0 236px}
.gauge-l{font-size:11px; color:var(--faint); text-transform:uppercase;
  letter-spacing:.08em; font-weight:600; margin-bottom:7px}

figure{margin:0 0 26px; background:var(--panel); border:1px solid var(--line);
  border-radius:11px; padding:20px 22px 16px; box-shadow:var(--shadow)}
figure h2{font-size:15.5px}
.fig-sub{color:var(--muted); font-size:13px; margin:5px 0 14px; max-width:74ch}
.scroll{overflow-x:auto}
figcaption{color:var(--faint); font-size:12px; margin-top:12px;
  padding-top:12px; border-top:1px solid var(--line-soft); max-width:80ch}
.legend{display:flex; gap:15px; flex-wrap:wrap; margin:0 0 14px; font-size:12px; color:var(--muted)}
.key{display:inline-flex; align-items:center; gap:6px}
.key i{width:15px; height:3px; border-radius:2px; display:inline-block}

.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
  gap:12px; margin-bottom:22px}
.kpi{background:var(--panel); border:1px solid var(--line); border-radius:11px;
  padding:15px 17px; box-shadow:var(--shadow)}
.kpi .k-l{font-size:11px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--faint); font-weight:650}
.kpi .k-v{font-size:27px; font-weight:640; letter-spacing:-.02em; margin-top:5px; line-height:1.15}
.kpi .k-s{font-size:12px; color:var(--muted); margin-top:3px}

.stage{background:var(--panel); border:1px solid var(--line); border-radius:11px;
  margin-bottom:12px; overflow:hidden; box-shadow:var(--shadow)}
.stage summary{list-style:none; cursor:pointer; padding:15px 20px;
  display:flex; align-items:center; gap:14px}
.stage summary::-webkit-details-marker{display:none}
.stage summary:hover{background:var(--sunk)}
.stage summary:focus-visible{outline:2px solid var(--series-1); outline-offset:-2px}
.n{flex:none; width:23px; height:23px; border-radius:6px; background:var(--sunk);
  color:var(--muted); font-size:11.5px; font-weight:700;
  display:grid; place-items:center; border:1px solid var(--line-soft)}
.stage[open] .n{background:var(--series-1); color:#fff; border-color:transparent}
.s-t{flex:1; min-width:0}
.s-t h3{font-size:14.5px}
.s-t p{margin:2px 0 0; color:var(--faint); font-size:12.5px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.caret{flex:none; color:var(--faint); transition:transform .18s}
.stage[open] .caret{transform:rotate(90deg)}
.s-body{padding:0 20px 18px; border-top:1px solid var(--line-soft)}
.s-why{color:var(--muted); font-size:13.2px; margin:14px 0 15px; max-width:78ch}

table{width:100%; border-collapse:collapse; font-size:13px}
th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.075em;
  color:var(--faint); font-weight:700; padding:0 10px 7px 0; border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right; padding-left:16px; padding-right:0}
th.r:last-child,td.r:last-child{padding-left:18px}
td{padding:8px 10px 8px 0; border-bottom:1px solid var(--line-soft); vertical-align:top}
tr:last-child td{border-bottom:0}
.src{white-space:nowrap; font-size:12.5px}
.loc{color:var(--faint); font-size:11.5px; white-space:nowrap}
.snip{color:var(--muted); font-size:12.3px; line-height:1.45;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.delta{font-size:12px; font-weight:650}
.delta.u{color:var(--good)} .delta.d{color:var(--critical)} .delta.z{color:var(--faint); font-weight:400}
.both{color:var(--series-1); font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:0}

/* status: colour never alone -- always icon + label */
.st{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; white-space:nowrap}
.st svg{flex:none}
.st.ok{color:var(--good)} .st.warn{color:var(--serious)}
.st.bad{color:var(--critical)} .st.idle{color:var(--faint)}

.meter-l{display:flex; justify-content:space-between; font-size:12px;
  color:var(--muted); margin-bottom:6px}
.meter{height:9px; border-radius:5px; background:var(--sunk); overflow:hidden}
.meter i{display:block; height:100%; border-radius:5px; background:var(--series-1);
  transition:width .3s}

.empty{color:var(--faint); font-size:13px; padding:14px 0; font-style:italic}
.status{color:var(--muted); font-size:13.5px; padding:40px 0; text-align:center}
.err{color:var(--critical)}
.tip{position:fixed; pointer-events:none; z-index:9; background:var(--panel);
  border:1px solid var(--line); border-radius:8px; padding:8px 11px; font-size:12px;
  box-shadow:var(--shadow); max-width:290px; opacity:0; transition:opacity .12s}
.tip b{display:block; margin-bottom:2px}
.tip span{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
@media (max-width:720px){ .wrap,.head-in{padding-left:18px; padding-right:18px} .gauge{flex:1 1 100%} }
</style>
</head>
<body>

<header>
  <div class="head-in">
    <div class="brand">
      <h1>
        <svg class="spark" viewBox="0 0 26 14" fill="none" aria-hidden="true">
          <polyline points="0,11 5,11 8,3 12,13 15,7 18,7" stroke="currentColor"
                    stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="21.5" cy="7" r="2.6" fill="currentColor"/>
        </svg>
        Retrieval Inspector
      </h1>
      <p>Every stage of the pipeline, and what each one changed.</p>
    </div>
    <button class="themer" id="themer" type="button">Theme</button>

    <div class="views" role="tablist" aria-label="Views">
      <button class="view-btn" role="tab" id="v-ask" aria-controls="p-ask" aria-selected="true" type="button">Inspect a question</button>
      <button class="view-btn" role="tab" id="v-corpus" aria-controls="p-corpus" aria-selected="false" tabindex="-1" type="button">Corpus &amp; indexing</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="p-ask" role="tabpanel" aria-labelledby="v-ask">
    <form class="query" id="form">
      <input id="q" placeholder="Ask a question about the corpus&hellip;" autocomplete="off" aria-label="Question">
      <button class="btn" id="go" type="submit">Trace</button>
    </form>
    <div class="examples" id="examples"><span>Try:</span></div>
    <div id="out"><div class="status" id="status">Loading corpus&hellip;</div></div>
  </div>

  <div id="p-corpus" role="tabpanel" aria-labelledby="v-corpus" hidden>
    <div class="stack" id="corpus-out"></div>
  </div>
</div>

<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short = s => String(s).replace(/\.(pdf|docx|pptx|xlsx)$/i, "");
const nf = n => Number(n).toLocaleString();

const ICON = {
  ok:   '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bad:  '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.4v5M8 11.6v.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  warn: '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.2l6 11.3H2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 6.6v3M8 11.6v.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  idle: '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2.6 2.2"/></svg>'
};

/* ---------------------------------------------------------------- theme */
$("#themer").onclick = () => {
  const now = document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", now === "dark" ? "light" : "dark");
  if (window.__last) renderTrace(window.__last);
};

/* ---------------------------------------------------------------- views */
const tabs = [...document.querySelectorAll('[role="tab"]')];
tabs.forEach(t => {
  t.onclick = () => {
    tabs.forEach(o => {
      const on = o === t;
      o.setAttribute("aria-selected", on ? "true" : "false");
      o.tabIndex = on ? 0 : -1;
      document.getElementById(o.getAttribute("aria-controls")).hidden = !on;
    });
    if (t.id === "v-corpus") loadCorpusView();
  };
});

/* ------------------------------------------------------- series colours
   Emphasis, not identity-for-everyone. Only documents reaching the final
   answer are coloured, and only the first three -- past that no ordering
   clears the all-pairs CVD floor, so the fourth is grey and carries its name
   as a direct label. Colour follows the document, never its rank. */
const SLOTS = ["var(--series-1)", "var(--series-2)", "var(--series-3)"];
function palette(finalSources) {
  const m = new Map();
  finalSources.forEach((s, i) => m.set(s, i < SLOTS.length ? SLOTS[i] : "var(--series-other)"));
  return src => m.get(src) || "var(--series-other)";
}

/* ------------------------------------------------------------- tooltip */
const tip = $("#tip");
function showTip(html, ev) {
  tip.innerHTML = html; tip.style.opacity = "1";
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => tip.style.opacity = "0";

/* -------------------------------------------------------------- corpus */
let CORPUS = null;
fetch("/api/corpus").then(r => r.json()).then(c => {
  CORPUS = c;
  $("#status").textContent =
    `${nf(c.chunks)} chunks from ${c.documents} documents. Ask a question to begin.`;
  const box = $("#examples");
  (c.examples || []).forEach(x => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = x.label; b.title = x.q;
    b.onclick = () => { $("#q").value = x.q; $("#form").requestSubmit(); };
    box.appendChild(b);
  });
}).catch(() => $("#status").textContent = "Could not reach the server.");

/* --------------------------------------------------------------- query */
$("#form").onsubmit = async e => {
  e.preventDefault();
  const q = $("#q").value.trim();
  if (!q) return;
  $("#go").disabled = true;
  const out = $("#out");
  if (window.__last) out.classList.add("stale");
  else out.innerHTML = `<div class="status">Running the pipeline&hellip;</div>`;
  try {
    const r = await fetch("/api/trace", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: q})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    window.__last = data;
    renderTrace(data);
  } catch (err) {
    out.innerHTML = `<div class="status err">${esc(err.message)}</div>`;
  } finally {
    out.classList.remove("stale");
    $("#go").disabled = false;
  }
};

function renderTrace(data) {
  const out = $("#out");
  const final = data.stages[data.stages.length - 1].items;
  const order = [...new Set(final.map(i => i.source))];
  const color = palette(order);
  out.innerHTML = "";
  out.appendChild(verdictEl(data.verdict, color));
  out.appendChild(flowFigure(data.stages, color, order));
  data.stages.forEach((s, i) => out.appendChild(stageEl(s, i + 1, color)));
}

function verdictEl(v, color) {
  const el = document.createElement("section");
  const ok = v.confident;
  el.className = "verdict" + (ok ? "" : " abstain");
  el.innerHTML = `
    <div class="v-main">
      <div class="v-tag">${ok ? ICON.ok : ICON.bad}${ok ? "Answering" : "Declined — below threshold"}</div>
      <p>${esc(v.explanation)}</p>
      <div class="v-docs">${(v.documents || []).map(d =>
        `<span class="doc-pill"><i style="background:${color(d)}"></i>${esc(short(d))}</span>`).join("")}</div>
    </div>
    <div class="gauge">
      <div class="gauge-l">Confidence</div>
      ${gauge(v.confidence, v.threshold)}
    </div>`;
  return el;
}

/* A meter, not a chart: one value against a limit. The threshold sits at its
   true position, because a score means nothing without knowing the line. */
function gauge(score, threshold) {
  if (score === null || score === undefined) return "";
  const LO = -12, HI = 12, W = 236, H = 48;
  const x = v => ((Math.max(LO, Math.min(HI, v)) - LO) / (HI - LO)) * (W - 2) + 1;
  const ok = score >= threshold;
  const col = ok ? "var(--good)" : "var(--critical)";
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
       aria-label="Confidence ${score.toFixed(2)} against threshold ${threshold.toFixed(1)}; ${ok ? "above" : "below"}">
    <rect x="1" y="9" width="${W - 2}" height="8" rx="4" fill="var(--sunk)"/>
    <rect x="${Math.min(x(threshold), x(score))}" y="9"
          width="${Math.abs(x(score) - x(threshold))}" height="8" rx="4" fill="${col}"/>
    <line x1="${x(threshold)}" y1="4" x2="${x(threshold)}" y2="22"
          stroke="var(--ink)" stroke-width="1.5"/>
    <text x="${x(threshold)}" y="33" font-size="10" fill="var(--faint)" text-anchor="middle">threshold ${threshold.toFixed(1)}</text>
    <circle cx="${x(score)}" cy="13" r="5.5" fill="${col}" stroke="var(--panel)" stroke-width="2"/>
    <text x="${x(score)}" y="47" font-size="12.5" fill="${col}" text-anchor="middle"
          font-weight="700">${score > 0 ? "+" : ""}${score.toFixed(2)}</text>
  </svg>`;
}

/* ------------------------------------------------------------ bump chart */
function flowFigure(stages, color, order) {
  const fig = document.createElement("figure");
  const cols = stages.map(s => ({
    name: s.title.replace(/ \(.*\)/, "").replace(/^Reciprocal rank /, "").replace(/^Cross-encoder /, ""),
    rank: new Map(s.items.map(i => [i.chunk_id, i.rank])),
    all:  new Map(s.items.map(i => [i.chunk_id, i]))
  }));
  const lastCol = cols[cols.length - 1];
  const finalIds = [...lastCol.rank.keys()];
  const notable = new Set(finalIds);
  cols.forEach(c => c.rank.forEach((r, id) => { if (r <= 3) notable.add(id); }));

  // Depth follows the lines actually drawn, not the candidate count. Fixed at
  // 12 it rendered five empty rows on every real query, because the passages
  // worth showing all sit near the top. Derived AFTER `notable` is known --
  // computing it from s.items.length just measured the shortlist size (20).
  let deepest = 1;
  cols.forEach(c => c.rank.forEach((r, id) => {
    if (notable.has(id) && r <= 12 && r > deepest) deepest = r;
  }));
  const DEPTH = Math.min(12, Math.max(5, deepest));
  cols.forEach(c => { for (const [id, r] of c.rank) if (r > DEPTH) c.rank.delete(id); });

  const W = 980, L = 26, R = 172, TOP = 46, ROW = 25, H = TOP + ROW * DEPTH + 26;
  const cw = (W - L - R) / cols.length;
  const cx = i => L + cw * i + cw / 2;
  const cy = r => TOP + (r - 0.5) * ROW;

  let g = "";
  cols.forEach((c, i) => {
    g += `<text x="${cx(i)}" y="18" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)">${esc(c.name)}</text>`;
    g += `<text x="${cx(i)}" y="33" text-anchor="middle" font-size="10" fill="var(--faint)">${c.all.size} items</text>`;
  });
  for (let r = 1; r <= DEPTH; r++) {
    g += `<line x1="${L}" y1="${cy(r)}" x2="${W - R}" y2="${cy(r)}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${L - 6}" y="${cy(r) + 3.5}" font-size="9.5" fill="var(--faint)" text-anchor="end" class="mono">${r}</text>`;
  }

  // Context lines first, so survivors draw on top of them.
  const ids = [...notable].sort((a, b) => (finalIds.includes(a) ? 1 : 0) - (finalIds.includes(b) ? 1 : 0));
  const labels = [];
  ids.forEach(id => {
    const pts = [];
    cols.forEach((c, i) => { const r = c.rank.get(id); if (r) pts.push([cx(i), cy(r), i]); });
    if (!pts.length) return;
    const meta = cols.find(c => c.all.has(id)).all.get(id);
    const isFinal = lastCol.rank.has(id);
    const col = isFinal ? color(meta.source) : "var(--series-other)";
    const w = isFinal ? 2.2 : 1.1, op = isFinal ? 1 : .3;

    for (let j = 0; j < pts.length - 1; j++) {
      const [x1, y1, i1] = pts[j], [x2, y2, i2] = pts[j + 1];
      g += `<path d="M${x1} ${y1} C ${x1 + cw * .42} ${y1}, ${x2 - cw * .42} ${y2}, ${x2} ${y2}"
        fill="none" stroke="${col}" stroke-width="${w}" opacity="${op}"
        ${i2 - i1 > 1 ? 'stroke-dasharray="3 3"' : ""}/>`;
    }
    pts.forEach(([x, y]) => {
      g += `<circle cx="${x}" cy="${y}" r="${isFinal ? 4 : 2.4}" fill="${col}" opacity="${op}"
        stroke="var(--panel)" stroke-width="${isFinal ? 2 : 0}"
        data-src="${esc(meta.source)}" data-loc="${esc(meta.locator)}" data-txt="${esc(meta.text.slice(0,150))}"
        style="cursor:crosshair"/>`;
    });
    if (isFinal) {
      const [lx, ly] = pts[pts.length - 1];
      const existing = labels.find(l => l.src === meta.source);
      if (existing) {                     // same document, second passage
        existing.locs.push(meta.locator);
        existing.y = Math.min(existing.y, ly);
      } else {
        labels.push({y: ly, x: lx, col, src: meta.source,
                     name: short(meta.source), locs: [meta.locator]});
      }
    }
  });
  // Nudge overlapping labels apart rather than letting them collide.
  labels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < labels.length; i++)
    if (labels[i].y - labels[i - 1].y < 15) labels[i].y = labels[i - 1].y + 15;
  labels.forEach(l => {
    // Truncate on a word boundary rather than mid-token, and only if needed.
    let nm = l.name;
    if (nm.length > 24) nm = nm.slice(0, 23).replace(/[_\-. ][^_\-. ]*$/, "") + "…";
    g += `<line x1="${l.x + 7}" y1="${l.y}" x2="${W - R + 8}" y2="${l.y}" stroke="${l.col}" stroke-width="1" opacity=".4"/>`;
    g += `<text x="${W - R + 13}" y="${l.y - 1}" font-size="11.5" font-weight="640" fill="${l.col}">${esc(nm)}</text>`;
    g += `<text x="${W - R + 13}" y="${l.y + 11}" font-size="10" fill="var(--faint)">${esc(l.locs.join(", "))}</text>`;
  });

  const svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:820px;height:auto"
      role="img" aria-label="Rank of each passage across the five pipeline stages. Lines that rise were promoted. The per-stage tables below list every value shown here.">${g}</svg>`;

  fig.innerHTML = `
    <h2>Where each passage travelled</h2>
    <p class="fig-sub">Vertical position is rank. Solid coloured lines are the passages that survived
      into the final answer; grey lines were overtaken along the way. A dashed segment means the
      passage sat outside the top ${DEPTH} at that stage.</p>
    <div class="legend">
      ${order.map(d => `<span class="key"><i style="background:${color(d)}"></i>${esc(short(d))}</span>`).join("")}
      <span class="key"><i style="background:var(--series-other);opacity:.4"></i>did not survive</span>
    </div>
    <div class="scroll">${svg}</div>
    <figcaption>Steep climbs are the pipeline earning its keep: a passage found by the cheap stage
      and promoted by the expensive one. Every value here also appears in the per-stage tables below.</figcaption>`;

  fig.querySelectorAll("circle[data-src]").forEach(c => {
    c.addEventListener("mousemove", e => showTip(
      `<b>${esc(short(c.dataset.src))}</b><span>${esc(c.dataset.loc)}</span>
       <span style="display:block;margin-top:5px">${esc(c.dataset.txt)}…</span>`, e));
    c.addEventListener("mouseleave", hideTip);
  });
  return fig;
}

function stageEl(s, n, color) {
  const el = document.createElement("details");
  el.className = "stage";
  if (n === 1) el.open = true;
  const rows = s.items.slice(0, 10).map(i => {
    const d = i.delta;
    const cls = d > 0 ? "u" : d < 0 ? "d" : "z";
    const move = d === undefined ? "" :
      `<td class="r delta ${cls}">${d > 0 ? "↑" + d : d < 0 ? "↓" + (-d) : "–"}</td>`;
    const cross = i.also_found_by !== undefined
      ? `<td class="r mono">${i.also_found_by ? `<span class="both">#${i.also_found_by}</span>` : "–"}</td>` : "";
    const agree = i.agreement !== undefined
      ? `<td class="r mono">${i.dense_rank ? "d" + i.dense_rank : "–"} / ${i.sparse_rank ? "s" + i.sparse_rank : "–"}</td>` : "";
    return `<tr>
      <td class="r mono" style="color:var(--faint)">${i.rank}</td>
      <td><div class="src"><span class="dot" style="background:${color(i.source)}"></span>${esc(short(i.source))}</div>
          <div class="loc">${esc(i.locator)}</div></td>
      <td><div class="snip">${esc(i.text)}</div></td>
      ${cross}${agree}${move}
      <td class="r mono">${typeof i.score === "number" ? (i.score > 0 && s.name === "reranked" ? "+" : "") + i.score : ""}</td>
    </tr>`;
  }).join("");
  const f = s.items[0] || {};
  el.innerHTML = `
    <summary>
      <span class="n">${n}</span>
      <span class="s-t"><h3>${esc(s.title)}</h3><p>${esc(s.note)}</p></span>
      <svg class="caret" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <polyline points="5,3 9,7 5,11" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"/></svg>
    </summary>
    <div class="s-body">
      <p class="s-why">${esc(s.detail)}</p>
      ${s.items.length ? `<div class="scroll"><table>
        <thead><tr><th class="r">#</th><th>Document</th><th>Passage</th>
          ${f.also_found_by !== undefined ? '<th class="r">Other</th>' : ""}
          ${f.agreement !== undefined ? '<th class="r">d / s</th>' : ""}
          ${f.delta !== undefined ? '<th class="r">Move</th>' : ""}
          <th class="r">Score</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`
      : `<div class="empty">No results — no query term appears anywhere in the corpus.</div>`}
    </div>`;
  return el;
}

/* ================================================== corpus & indexing view */
let poll = null;

function loadCorpusView() {
  renderCorpus(window.__idx || null);
  fetch("/api/index/status").then(r => r.json()).then(s => { window.__idx = s; renderCorpus(s); }).catch(() => {});
}

$("#p-corpus").addEventListener("click", async e => {
  const btn = e.target.closest("#rebuild");
  if (!btn) return;
  btn.disabled = true;
  const r = await fetch("/api/index/start", {method: "POST"});
  if (r.status === 409) { btn.disabled = false; return; }
  if (!poll) poll = setInterval(tick, 700);
  tick();
});

async function tick() {
  try {
    const s = await (await fetch("/api/index/status")).json();
    window.__idx = s;
    renderCorpus(s);
    if (s.state !== "running") {
      if (poll) { clearInterval(poll); poll = null; }
      // The corpus changed underneath us; refresh the document list.
      const c = await (await fetch("/api/corpus")).json();
      CORPUS = c; renderCorpus(s);
    }
  } catch { if (poll) { clearInterval(poll); poll = null; } }
}

function renderCorpus(s) {
  const box = $("#corpus-out");
  const c = CORPUS || {chunks: 0, documents: 0, sources: []};
  const running = s && s.state === "running";
  const done = s && s.state === "done" && s.summary;
  const cache = s && s.totals && s.totals.cache;
  const scan = s && s.totals && s.totals.scan;

  const seen = s ? s.files.length : 0;
  const total = scan ? scan.documents : (c.documents || 0);
  const pct = total ? Math.round(seen / total * 100) : 0;
  const reusePct = cache && cache.requested ? Math.round(cache.reused / cache.requested * 100) : null;
  const failed = s ? s.files.filter(f => f.status === "FAIL").length : 0;
  const warned = s ? s.files.filter(f => f.status === "WARN").length : 0;

  box.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="k-l">Documents</div><div class="k-v">${nf(total)}</div>
        <div class="k-s">${failed ? failed + " unreadable" : "all readable"}${warned ? ", " + warned + " partial" : ""}</div></div>
      <div class="kpi"><div class="k-l">Chunks</div><div class="k-v">${nf(done ? s.summary.chunks : c.chunks)}</div>
        <div class="k-s">searchable passages</div></div>
      <div class="kpi"><div class="k-l">Work reused</div>
        <div class="k-v">${reusePct === null ? "–" : reusePct + "%"}</div>
        <div class="k-s">${cache ? nf(cache.reused) + " of " + nf(cache.requested) + " embeddings" : "re-index to measure"}</div></div>
      <div class="kpi"><div class="k-l">Last run</div>
        <div class="k-v">${done ? s.summary.seconds.toFixed(1) + "s" : running ? s.elapsed.toFixed(1) + "s" : "–"}</div>
        <div class="k-s">${done ? (s.summary.model_loaded ? "model was loaded" : "model never loaded") : running ? "in progress" : "not run this session"}</div></div>
    </div>

    <figure>
      <h2>Indexing</h2>
      <p class="fig-sub">Re-indexing skips any document whose bytes have not changed, so this is
        fast unless you have actually added or edited something. Drop files into
        <code>data/</code> first, then re-index.</p>
      ${s && s.state !== "idle" ? `
        <div class="meter-l"><span>${running ? "Processing" : "Complete"} — ${seen} of ${total} documents</span><span class="mono">${pct}%</span></div>
        <div class="meter"><i style="width:${pct}%;${done ? "background:var(--good)" : ""}"></i></div>` : ""}
      ${s && s.error ? `<p class="err" style="margin-top:12px">${esc(s.error)}</p>` : ""}
      <div style="margin-top:16px"><button class="btn ghost" id="rebuild" ${running ? "disabled" : ""}>
        ${running ? "Indexing…" : "Re-index the corpus"}</button></div>
    </figure>

    ${s && s.files.length ? `<figure>
      <h2>Per document</h2>
      <p class="fig-sub">A document that fails is left out of the index entirely — adding chunks
        that can never be retrieved would quietly lower every metric with no visible cause.</p>
      <div class="scroll"><table>
        <thead><tr><th class="r">#</th><th>Document</th><th>Status</th><th class="r">Units</th><th class="r">Chunks</th><th>Detail</th></tr></thead>
        <tbody>${s.files.map(f => `<tr>
          <td class="r mono" style="color:var(--faint)">${f.index || "–"}</td>
          <td>${esc(short(f.document))}</td>
          <td>${statusCell(f.status)}</td>
          <td class="r mono">${f.units == null ? "–" : nf(f.units)}</td>
          <td class="r mono">${f.chunks == null ? "–" : nf(f.chunks)}</td>
          <td class="snip" style="max-width:280px">${esc(f.detail)}</td></tr>`).join("")}</tbody>
      </table></div>
    </figure>` : ""}

    <figure>
      <h2>Documents in the index</h2>
      <p class="fig-sub">${nf(c.chunks)} chunks across ${c.documents} documents.</p>
      <div class="scroll"><table>
        <thead><tr><th class="r">#</th><th>Document</th></tr></thead>
        <tbody>${(c.sources || []).map((d, i) =>
          `<tr><td class="r mono" style="color:var(--faint)">${i + 1}</td><td>${esc(short(d))}</td></tr>`).join("")}</tbody>
      </table></div>
    </figure>`;
}

function statusCell(st) {
  const map = {ok: ["ok", "Indexed"], WARN: ["warn", "Partial"], FAIL: ["bad", "Unreadable"], SKIP: ["idle", "Skipped"]};
  const [cls, label] = map[st] || ["idle", String(st)];
  return `<span class="st ${cls}">${ICON[cls]}${label}</span>`;
}
</script>
</body>
</html>
