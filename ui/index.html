<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retrieval Inspector</title>
<style>
/* ---------------------------------------------------------------- type
   Inter and DM Mono, served from this repo. No CDN, no external request: the
   corpus this indexes may be private, and a page about private documents
   should not announce itself to a font host on load. */
@font-face{font-family:Inter;src:url("/fonts/Inter-400_700.woff2") format("woff2");
  font-weight:400 700;font-display:swap;font-style:normal}
@font-face{font-family:"DM Mono";src:url("/fonts/DMMono-400.woff2") format("woff2");
  font-weight:400;font-display:swap;font-style:normal}
@font-face{font-family:"DM Mono";src:url("/fonts/DMMono-500.woff2") format("woff2");
  font-weight:500;font-display:swap;font-style:normal}

/* ============================================================== tokens
   Light ground, monochrome discipline. The greys are a single neutral ramp so
   nothing competes with the data; the only colour on the page belongs to
   documents, and only to documents that reached an answer.

   Series colours are NOT hand-picked. They are the first three slots of a
   documented categorical palette, validated all-pairs against this page's
   surfaces -- lines can sit anywhere, so an adjacent-only check would hide a
   collapse. Worst CVD dE 9.2, normal vision 24.0. Only three: no ordering of
   more clears the all-pairs floor, so a fourth document folds to grey and is
   identified by its direct label. */
:root{
  --bg:#F4F5F6;
  --panel:#FFFFFF;
  --sunk:#ECEEEF;
  --ink:#000000;
  --near:#111416;
  --soft:#3C4142;
  --muted:#6E7476;
  --faint:#9AA0A2;
  --line:#E2E4E6;
  --rule:#C3C9CC;

  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
  --series-other:#9AA0A2;
  --good:#0ca30c; --critical:#d03b3b; --serious:#b3705f;

  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --max:1240px;
  --pad:clamp(1.25rem,4vw,3.25rem);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.022em;line-height:1.08}
button{font:inherit;color:inherit}

/* The micro-label. Used on every panel, axis and field on the page -- it is
   the single device that makes a screen read as an instrument. */
.lab{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------- masthead
   A folio line, not a navbar: it names the artifact and gets out of the way. */
.folio{border-bottom:1px solid var(--rule);background:var(--panel)}
.folio-in{max-width:var(--max);margin:0 auto;padding:0 var(--pad);height:54px;
  display:flex;align-items:center;gap:22px}
.folio .name{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.folio .rule{flex:1;height:1px;background:var(--rule)}

.seg{display:flex;gap:0}
.seg button{border:0;background:none;padding:6px 0;margin-left:22px;cursor:pointer;
  font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);position:relative;white-space:nowrap}
.seg button:hover{color:var(--soft)}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;
  bottom:-1px;height:1px;background:var(--ink)}
.seg .lock{opacity:.55}

.hint{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
.hint > div{border-top:1px solid var(--line);padding:8px 0;font-size:12.5px;color:var(--muted)}
.hint b{color:var(--serious);font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;margin-right:10px;font-weight:500}

/* ------------------------------------------------------------- intake
   A plain text field and a button. A browser cannot hand a filesystem path to
   a server -- a picker returns bytes, never a location -- so pasting the path
   is not a lesser version of a folder picker, it is the only version there is;
   saying so beats a disabled control that implies otherwise. */
.intake{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0 12px}
.intake input{flex:1;min-width:260px;padding:8px 10px;border:1px solid var(--rule);
  background:var(--panel);color:var(--ink);font-family:var(--mono);font-size:12px}
.intake input:focus{outline:0;border-color:var(--ink)}
.intake button{border:1px solid var(--rule);background:var(--panel);padding:8px 14px;
  font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.13em;
  text-transform:uppercase;cursor:pointer;white-space:nowrap;
  transition:transform 160ms var(--ease-out),border-color 160ms var(--ease-out)}
.intake button:hover:not(:disabled){border-color:var(--ink)}
.intake button:active:not(:disabled){transform:scale(.97)}
.intake button:disabled{opacity:.4;cursor:default}
.intake .warn{flex-basis:100%;font-size:12px;color:var(--muted)}
.intake .warn b{color:var(--serious)}
.intake-log{max-height:190px;overflow:auto;margin:0 0 12px;font-size:12px}
.intake-log tr.fail td{color:var(--critical)}
.intake-log tr.skip td{color:var(--faint)}

/* ---------------------------------------------------------------- shell */
.wrap{max-width:var(--max);margin:0 auto;padding:34px var(--pad) 96px}

.ask{display:flex;border:1px solid var(--rule);background:var(--panel)}
.ask input{flex:1;min-width:0;padding:16px 18px;border:0;background:none;color:var(--ink);
  font:inherit;font-size:16px;letter-spacing:-.008em}
.ask input:focus{outline:0}
.ask:focus-within{border-color:var(--ink)}
.ask button{border:0;background:var(--ink);color:var(--panel);padding:0 26px;
  font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;cursor:pointer;white-space:nowrap}
.ask button{transition:transform 160ms var(--ease-out),opacity 160ms var(--ease-out)}
.ask button:active{transform:scale(.97)}
.ask button:disabled{opacity:.35;cursor:default}

/* Suggestions: short labels, the full question on hover. */
.sugs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sug{background:none;border:1px solid var(--rule);padding:6px 12px;cursor:pointer;
  font-size:12.5px;color:var(--muted);
  transition:color 160ms var(--ease-out),border-color 160ms var(--ease-out),
             transform 160ms var(--ease-out)}
.sug:hover{color:var(--ink);border-color:var(--ink)}
.sug:active{transform:scale(.97)}
.sug .lab{display:none}

/* --------------------------------------------------------------- panel */
.panel{border:1px solid var(--rule);background:var(--panel);margin-top:24px}
.panel.enter{animation:rise 380ms var(--ease-out) both}
.panel.enter:nth-of-type(2){animation-delay:60ms}
.panel.enter:nth-of-type(3){animation-delay:120ms}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel.enter{animation:none}}
.phead{display:flex;align-items:center;gap:16px;padding:10px 16px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.phead .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.phead button{border:1px solid var(--rule);background:var(--panel);padding:5px 12px;
  font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.13em;
  text-transform:uppercase;cursor:pointer}
.phead button{transition:transform 160ms var(--ease-out),border-color 160ms var(--ease-out)}
.phead button:hover{border-color:var(--ink)}
.phead button:active{transform:scale(.97)}
.phead input[type=range]{width:180px;accent-color:var(--ink)}

#city{display:block;width:100%;height:clamp(360px,42vw,520px)}
.caption{border-top:1px solid var(--line);padding:14px 16px;color:var(--muted);
  font-size:13.5px;min-height:54px}
.caption b{color:var(--ink);font-weight:600}

/* ---------------------------------------------- the answer — the climax */
.answer{border-top:2px solid var(--good)}
.answer.declined{border-top-color:var(--critical)}
/* A third state. Reranking off means no calibrated score, so the gate did not
   run -- neither approval nor refusal, and it must not be coloured as either. */
.answer.ungated{border-top-color:var(--rule)}
.answer.ungated .verdict .v{color:var(--muted)}
.abody{padding:26px 28px}
.verdict{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.verdict .v{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;color:var(--good)}
.answer.declined .verdict .v{color:var(--critical)}
.verdict .score{font-family:var(--mono);font-size:11px;color:var(--faint)}
blockquote{margin:22px 0 0;font-size:30px;line-height:1.34;letter-spacing:-.028em;
  max-width:22em;font-weight:400;color:var(--ink)}
@media (max-width:760px){blockquote{font-size:22px}}
.credit{display:flex;align-items:center;gap:10px;margin-top:16px;
  font-family:var(--mono);font-size:10.5px;color:var(--muted);flex-wrap:wrap;
  letter-spacing:.04em}
.credit i{width:8px;height:8px;flex:none}
.why{margin:16px 0 0;color:var(--muted);font-size:13.5px;max-width:64ch}
.why b{color:var(--soft);font-weight:600}

/* Typographic rows: label, thin rule, value, right-aligned status. */
.rows{margin-top:24px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 76px 1fr 70px;gap:16px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line)}
.row .name{display:flex;align-items:center;gap:9px;font-size:13.5px;min-width:0}
.row .name i{width:8px;height:8px;flex:none}
.row .bar{height:2px;background:var(--sunk);position:relative}
.row .bar i{position:absolute;inset:0 auto 0 0}
.row .n,.row .s{font-family:var(--mono);font-size:10.5px;color:var(--faint);
  letter-spacing:.04em}
.row .s{text-align:right}

details.more{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
details.more > summary{cursor:pointer;list-style:none;font-family:var(--mono);font-size:10px;
  font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"+ "}
details.more[open] > summary::before{content:"\2212 "}
details.more > summary:hover{color:var(--ink)}

/* -------------------------------------------------------------- tables */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-family:var(--mono);font-size:9.5px;font-weight:500;
  text-transform:uppercase;letter-spacing:.13em;color:var(--faint);
  padding:0 14px 8px 0;border-bottom:1px solid var(--rule)}
th.r,td.r{text-align:right;padding-left:20px;padding-right:0}
td{padding:9px 14px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.out{color:var(--faint)}
tr.out .snip{opacity:.6}
.src{white-space:nowrap;font-size:12.5px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;flex:none}
.loc{color:var(--faint);font-size:10px;font-family:var(--mono);margin-top:3px;
  letter-spacing:.04em}
.snip{color:var(--muted);font-size:12px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scroll{overflow-x:auto}

/* ------------------------------------------------------------ settings */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;margin-top:24px}
/* A setting the current pipeline never reaches. Dimmed and inert rather than
   hidden: it still has to be findable, and its absence explained. */
.setting.inert .opts{opacity:.4;pointer-events:none}
.setting .inertnote{margin:8px 0 0;font-size:12px;color:var(--muted);max-width:52ch}
.settings.busy{opacity:.5;pointer-events:none;transition:opacity 120ms var(--ease-out)}
#compare table{margin-top:8px}
#compare td:first-child{color:var(--soft);white-space:nowrap}
#compare .same{color:var(--faint)}
.grid2 .panel{margin-top:0;border-color:var(--line)}
@media (max-width:960px){.grid2{grid-template-columns:1fr}}
.settings{padding:4px 16px 12px}
.setting{border-bottom:1px solid var(--line);padding:13px 0}
.setting:last-child{border-bottom:0}
.setting .top{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.setting h3{font-size:13px;font-weight:600;letter-spacing:-.008em}
.setting .unit{margin-left:auto}
.opts{display:flex;gap:0}
.opt{background:none;border:0;border-left:1px solid var(--line);padding:3px 12px;
  cursor:pointer;text-align:left;color:var(--faint);display:flex;flex-direction:column;gap:2px}
.opt:first-child{border-left:0;padding-left:0}
.opt:hover{color:var(--soft)}
.opt[aria-pressed="true"]{color:var(--ink)}
.opt .k{font-size:12px;white-space:nowrap}
.opt .v{font-family:var(--mono);font-size:12px;letter-spacing:.02em}
.opt[aria-pressed="true"] .v{font-weight:500}

/* ---------------------------------------------------------- inspection */
.stage{border-bottom:1px solid var(--line)}
.stage:last-child{border-bottom:0}
.stage > summary{cursor:pointer;list-style:none;padding:12px 16px;
  display:grid;grid-template-columns:22px 1fr;gap:14px;align-items:baseline}
.stage > summary::-webkit-details-marker{display:none}
.stage > summary:hover{background:var(--sunk)}
.stage .t{font-size:13px;font-weight:600;letter-spacing:-.008em}
.stage .note{display:block;margin-top:3px}
.stage .body{padding:0 16px 18px 52px}
.stage .body > p{margin:0 0 14px;color:var(--muted);font-size:12.5px;max-width:74ch}

.err{color:var(--critical)}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:760px){
  .folio-in{height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
  .folio .rule{display:none}
  .seg button{margin-left:0;margin-right:20px}
  .sug{grid-template-columns:1fr;gap:3px}
  .row{grid-template-columns:1fr 60px}
  .row .bar,.row .s{display:none}
  .abody{padding:20px}
}
</style>
</head>
<body>

<div class="folio">
  <div class="folio-in">
    <span class="name">Retrieval Inspector</span>
    <span class="rule"></span>
    <div class="seg" role="group" aria-label="Source">
      <button id="src-sample" aria-pressed="true" type="button">Sample corpus</button>
      <button id="src-folder" aria-pressed="false" type="button">Local folder</button>
      <button id="src-drive" aria-pressed="false" type="button">Drive <span class="lock">◇</span></button>
    </div>
    <span class="lab" id="readout">loading</span>
  </div>
  <div class="hint hide" id="hint"><div></div></div>
</div>

<div class="wrap">

  <form class="ask" id="form">
    <input id="q" placeholder="Ask a question about these documents" autocomplete="off"
           aria-label="Your question">
    <button id="go" type="submit">Trace</button>
  </form>
  <div class="sugs" id="sugs"></div>

  <section class="panel">
    <div class="phead">
      <span class="lab">The pipeline</span>
      <div class="right">
        <button id="play" type="button">Replay</button>
        <input type="range" id="p" min="0" max="100" value="0" aria-label="Stage">
        <span class="lab num" id="elapsed">idle</span>
      </div>
    </div>
    <canvas id="city"></canvas>
    <div class="caption" id="cap">Every block is a document, every road a path a passage can
      take. Ask something and it lights a route.</div>
  </section>

  <section class="panel answer hide" id="panel-answer">
    <div class="phead"><span class="lab">Answer</span>
      <div class="right"><span class="lab num" id="ansmeta"></span></div></div>
    <div class="abody" id="answer"></div>
  </section>

  <div class="grid2">
    <section class="panel hide" id="panel-settings">
      <div class="phead"><span class="lab">Settings</span>
        <div class="right"><span class="lab">84 labelled cases</span>
          <button id="reset" type="button" class="hide">Reset</button></div></div>
      <div class="settings" id="settings"></div>
      <div class="caption" id="compare" style="min-height:0;font-size:12px"></div>
    </section>

    <section class="panel hide" id="panel-stages">
      <div class="phead"><span class="lab">Stages</span>
        <div class="right"><span class="lab">nothing dropped</span></div></div>
      <div id="stages"></div>
    </section>
  </div>

</div>

<script type="module">
import { buildCity, buildRun, drawScene, captions, shortDoc } from "/pipeline-map.js";

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nf = n => Number(n).toLocaleString();

/* Parsed PDFs carry <br> where the extractor found a line break. It is real
   text, not markup, and showing it raw makes every passage look broken. */
const clean = s => String(s).replace(/<br\s*\/?>/gi, " ").replace(/\s+/g, " ").trim();

/* Chunks are cut on a token boundary, not a sentence one, so a passage
   routinely starts and ends mid-word. Marking both ends says "a fragment of
   something longer", which is what it is -- unmarked it just looks broken. */
const fragment = s => {
  const t = clean(s);
  if (!t) return t;
  return (/^[A-Z0-9"“(\[]/.test(t) ? "" : "… ") + t + (/[.!?"”)\]]$/.test(t) ? "" : " …");
};

const readInk = () => {
  const cs = getComputedStyle(document.body);
  const v = n => cs.getPropertyValue(n).trim();
  return { ink: v("--ink"), muted: v("--muted"), faint: v("--faint"), line: v("--line"),
    lineSoft: v("--line"), panel: v("--panel"), sunk: v("--sunk"), rule: v("--rule"),
    s1: v("--series-1"), s2: v("--series-2"), s3: v("--series-3"),
    other: v("--series-other"), good: v("--good"), critical: v("--critical") };
};

let CITY = null, RUN = null, INK = readInk(), EVAL = null, CORPUS = null;
const REPLAY_MS = 8000;

const cv = $("#city"), ctx = cv.getContext("2d");
function size() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { w: r.width, h: r.height };
}
function render() {
  const { w, h } = size();
  drawScene(ctx, CITY, RUN, INK, w, h, Number($("#p").value) / 100);
}
addEventListener("resize", render);
// Webfonts land after first paint; the canvas draws its own labels, so it has
// to be told to redraw or every label stays in the fallback face.
if (document.fonts) document.fonts.ready.then(render);

/* -------------------------------------------------------------- boot */
Promise.all([
  fetch("/api/chunks").then(r => r.json()),
  fetch("/api/corpus").then(r => r.json()),
  fetch("/api/eval").then(r => r.ok ? r.json() : null).catch(() => null),
]).then(([chunks, corpus, evalData]) => {
  CITY = buildCity(chunks); EVAL = evalData; CORPUS = corpus;
  $("#readout").textContent = `${nf(corpus.chunks)} chunks / ${corpus.documents} docs`;
  $("#sugs").innerHTML = (corpus.examples || []).map(x =>
    `<button class="sug" type="button" data-q="${esc(x.q)}" title="${esc(x.q)}">${esc(x.label)}</button>`).join("");
  $("#sugs").querySelectorAll(".sug").forEach(b => {
    b.onclick = () => { $("#q").value = b.dataset.q; run(b.dataset.q); };
  });
  render();
}).catch(() => {
  $("#readout").textContent = "server unreachable";
  $("#cap").innerHTML = `<span class="err">Start the server:
    <span class="num">.venv\\Scripts\\python.exe src\\serve.py</span></span>`;
});

/* -------------------------------------------------------- source picker
   Selecting is selecting. Drive is still unbuilt and says so in one line
   without becoming the selection, so the app is never left in a dead state.
   Local folder is now real -- see the intake below. */
const LOCKED = {
  "src-drive": "Native Google Docs are pointers, not files, so this needs the Drive export path. Files that are genuinely files -- a PDF or .docx in a synced Drive folder -- already work today: point Local folder at the synced directory.",
};
const TABS = ["src-sample", "src-folder", "src-drive"];
const hint = html => {
  $("#hint").classList.remove("hide");
  $("#hint").firstElementChild.innerHTML = html;
};

for (const id of TABS) {
  $("#" + id).onclick = () => {
    if (LOCKED[id]) { hint(`<b>not wired</b>${esc(LOCKED[id])}`); return; }
    for (const o of TABS) $("#" + o).setAttribute("aria-pressed", String(o === id));
    if (id === "src-folder") showIntake(); else showSample();
  };
}

/* The bundled corpus is a source like any other now, so it gets the same
   affordance rather than being the one tab that only relabels the page. Once a
   folder can replace the index, "Sample corpus" as an inert label would be
   claiming to be the current source without being able to make that true. */
function showSample() {
  hint(`
    <div class="intake">
      <div class="warn" style="flex:1;flex-basis:auto">The 20 papers bundled with the
        project, at <span class="num">${esc(CORPUS?.data_dir || "data/")}</span>. Re-index
        after adding or removing a file there.</div>
      <button id="sample-reindex" type="button">Re-index</button>
    </div>
    <div class="warn" id="folder-msg" style="padding-bottom:10px"></div>`);
  $("#sample-reindex").onclick = () => {
    $("#folder-check")?.remove();
    startIndex(null);
  };
}

/* ------------------------------------------------------------- intake
   Two steps, and the first is not optional: resolve the path, show what was
   found, and only then offer to index. Indexing REPLACES the vector store, so
   a mistyped path resolving to an empty folder would otherwise destroy a
   working index and report success. The server refuses that case outright;
   this makes a person see what they are about to replace before they can. */
function showIntake() {
  hint(`
    <div class="intake">
      <input id="folder" placeholder="C:\\Users\\you\\Documents\\contracts" spellcheck="false"
             aria-label="Folder path">
      <button id="folder-check" type="button">Check folder</button>
      <div class="warn" id="folder-msg">Paste a folder path — a browser cannot read one from a
        file picker, so this is the only form the request can take. PDF, DOCX, PPTX and XLSX
        are indexed; anything else is listed and skipped.
        <b>Indexing replaces the current index.</b></div>
    </div>`);
  $("#folder").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); check(); } };
  $("#folder-check").onclick = check;
}

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                              body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

async function check() {
  const path = $("#folder").value.trim();
  const msg = $("#folder-msg"), btn = $("#folder-check");
  if (!path) { msg.innerHTML = `<span class="err">Paste a folder path first.</span>`; return; }
  btn.disabled = true;
  msg.textContent = "Checking…";
  try {
    const d = await post("/api/index/inspect", { path });
    const skipped = d.skipped.length
      ? `<br>${d.skipped.length} file(s) would be skipped: ${d.skipped
          .slice(0, 4).map(x => esc(x.document)).join(", ")}${d.skipped.length > 4 ? "…" : ""}`
      : "";
    msg.innerHTML = `<b>found</b>${d.documents.length} document(s) in
      <span class="num">${esc(d.folder)}</span>. Indexing replaces the current
      ${nf(CORPUS?.chunks || 0)}-chunk index.${skipped}`;
    btn.textContent = "Index this folder";
    btn.onclick = () => startIndex(path);
  } catch (err) {
    msg.innerHTML = `<span class="err">${esc(err.message)}</span>`;
    btn.textContent = "Check folder";
    btn.onclick = check;
  } finally { btn.disabled = false; }
}

async function startIndex(path) {
  const msg = $("#folder-msg"), btn = $("#folder-check") || $("#sample-reindex");
  btn.disabled = true;
  try {
    // A null path means the configured corpus directory, which is what the CLI
    // and RAG_DATA_DIR have always indexed.
    await post("/api/index/start", path ? { path } : {});
    msg.innerHTML = `<b>indexing</b>Reading documents. A cold build of 20 PDFs took 432s;
      anything already parsed is cached and comes back in under a second.`;
    poll();
  } catch (err) {
    msg.innerHTML = `<span class="err">${esc(err.message)}</span>`;
    btn.disabled = false;
  }
}

/* Polling, not a socket: a run emits about one event per document, so the
   bottleneck is parsing and never the poll. */
function poll() {
  const msg = $("#folder-msg");
  const tick = async () => {
    let s;
    try { s = await fetch("/api/index/status").then(r => r.json()); }
    catch { setTimeout(tick, 1500); return; }

    const rows = s.files.slice(-40).map(f => `
      <tr class="${f.status === "FAIL" ? "fail" : f.status === "SKIP" ? "skip" : ""}">
        <td>${esc(f.document)}</td><td>${esc(f.status)}</td>
        <td class="r num">${f.chunks == null ? "" : nf(f.chunks)}</td>
        <td>${esc(f.detail || "")}</td></tr>`).join("");
    const log = `<div class="scroll intake-log"><table>
      <thead><tr><th>Document</th><th>Status</th><th class="r">Chunks</th><th>Note</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;

    if (s.state === "running") {
      msg.innerHTML = `<b>indexing</b>${s.files.length} of
        ${s.totals.scan?.documents ?? "?"} · ${s.elapsed}s${log}`;
      setTimeout(tick, 800);
      return;
    }
    if (s.state === "error") {
      msg.innerHTML = `<span class="err">${esc(s.error)}</span>`;
      ($("#folder-check") || $("#sample-reindex")).disabled = false;
      return;
    }
    if (s.state === "done") {
      const skipped = (s.summary?.skipped || []).length;
      msg.innerHTML = `<b>indexed</b>${nf(s.summary?.chunks || 0)} chunks from
        ${s.summary?.indexed ?? "?"} document(s) in ${s.elapsed}s${
        skipped ? `, ${skipped} excluded by the health check` : ""}.${log}`;
      ($("#folder-check") || $("#sample-reindex")).disabled = false;
      // The index on disk changed, so everything the page derives from it is
      // stale -- the corpus readout, the examples, and every block of the city.
      refreshCorpus();
    }
  };
  tick();
}

async function refreshCorpus() {
  const [chunks, corpus] = await Promise.all([
    fetch("/api/chunks").then(r => r.json()),
    fetch("/api/corpus").then(r => r.json()),
  ]);
  CORPUS = corpus;
  CITY = buildCity(chunks);
  RUN = null; BASE = null; LAST = null; QUESTION = "";
  $("#readout").textContent = `${nf(corpus.chunks)} chunks / ${corpus.documents} docs`;
  for (const id of ["panel-answer", "panel-settings", "panel-stages"])
    $("#" + id).classList.add("hide");
  $("#cap").textContent = "A new index. Ask something and it lights a route.";
  $("#elapsed").textContent = "idle";
  $("#p").value = 0;
  render();
}

/* --------------------------------------------------------------- run
   A question is traced twice whenever the settings are off their defaults. The
   defaults run is what the comparison under the settings is measured against,
   and carrying one over from a previous question would compare two different
   questions -- the exact mistake that once made a title-prefix change look like
   a win. A trace is ~400ms, so the honest version is also the cheap one. */
$("#form").onsubmit = e => { e.preventDefault(); run($("#q").value.trim()); };

let QUESTION = "", BASE = null, LAST = null;

async function trace(q, opts) {
  const t0 = performance.now();
  const r = await fetch("/api/trace", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: q, k: 5, ...opts }),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  data.ms = performance.now() - t0;
  return data;
}

async function run(q) {
  if (!q || !CITY) return;
  QUESTION = q;
  $("#go").disabled = true;
  $("#cap").textContent = "Running";
  try {
    BASE = await trace(q, DEFAULTS);
    LAST = atDefaults() ? BASE : await trace(q, OPTS);
    show(LAST);
    for (const id of ["panel-answer", "panel-settings", "panel-stages"]) {
      const el = $("#" + id);
      el.classList.remove("hide");
      el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter");
    }
    play();
  } catch (err) {
    $("#cap").innerHTML = `<span class="err">${esc(err.message)}</span>`;
  } finally { $("#go").disabled = false; }
}

/* Re-run the question already on screen under the current settings. */
async function rerun() {
  if (!QUESTION || !BASE) return;
  $("#settings").classList.add("busy");
  try {
    LAST = atDefaults() ? BASE : await trace(QUESTION, OPTS);
    show(LAST);
    play();
  } catch (err) {
    $("#compare").innerHTML = `<span class="err">${esc(err.message)}</span>`;
  } finally { $("#settings").classList.remove("busy"); }
}

function show(data) {
  INK = readInk();
  RUN = buildRun(data, CITY, INK);
  $("#elapsed").textContent =
    `${data.ms.toFixed(0)}ms · replay ${(REPLAY_MS / data.ms).toFixed(0)}×`;
  renderAnswer(data); renderSettings(); renderCompare(); renderStages(data);
}

/* ---------------------------------------------------------- playback */
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let raf = 0, playing = false;
function setProgress(v, moveSlider = true) {
  v = Math.max(0, Math.min(1, v));     // rAF can hand back a pre-start timestamp
  if (moveSlider) $("#p").value = Math.round(v * 100);
  render();
  if (!RUN) return;
  const caps = captions(RUN);
  if (!caps.length) return;
  const c = caps[Math.max(0, Math.min(caps.length - 1, Math.floor(v * caps.length)))];
  $("#cap").innerHTML = `<b>${esc(c.title)}.</b> ${esc(c.text)}`;
}
function stopPlay() { playing = false; cancelAnimationFrame(raf); $("#play").textContent = "Replay"; }
function play() {
  stopPlay();
  if (reduced()) { setProgress(1); return; }
  playing = true; $("#play").textContent = "Playing";
  const t0 = performance.now();
  const step = now => {
    if (!playing) return;
    const v = Math.min(1, (now - t0) / REPLAY_MS);
    setProgress(v);
    if (v < 1) raf = requestAnimationFrame(step); else stopPlay();
  };
  raf = requestAnimationFrame(step);
}
$("#play").onclick = play;
$("#p").oninput = e => { stopPlay(); setProgress(Number(e.target.value) / 100, false); };

/* ------------------------------------------------------------ answer */
function renderAnswer(data) {
  const v = data.verdict;
  const sel = data.stages[data.stages.length - 1].items;
  /* With reranking off the reranked stage is empty by design, so the candidate
     table falls back to the ranking that actually decided the result. */
  const rankStage = data.stages.find(s => s.name === "reranked");
  const ranked = (rankStage?.items.length ? rankStage
                  : data.stages.find(s => s.name === "fused"))?.items || [];
  const top = sel[0], colour = RUN.colour;
  /* Three states, not two. `ok` is "something was returned", which is true of
     an ungated run; `declined` is the only state that returns nothing. */
  const declined = v.confident === false;
  const ungated = v.confident === null;
  const ok = !declined;

  $("#panel-answer").className = "panel answer"
    + (declined ? " declined" : ungated ? " ungated" : "");
  $("#ansmeta").textContent = ok
    ? `${sel.length} passages / ${new Set(sel.map(i => i.source)).size} docs` : "nothing returned";

  /* Which documents answered, and how strongly -- grouped from what survived,
     so it reports what was returned rather than what was merely considered. */
  const byDoc = new Map();
  for (const i of sel) {
    const d = byDoc.get(i.source) || { source: i.source, n: 0, best: -Infinity };
    d.n += 1; d.best = Math.max(d.best, i.score); byDoc.set(i.source, d);
  }
  const docs = [...byDoc.values()].sort((a, b) => b.best - a.best);
  /* Scaled to this query's own range. The old floor of lo+1 assumed a
     cross-encoder score, which spans single digits; a fusion score never
     exceeds ~0.03, so every bar collapsed to a stub the moment reranking was
     switched off -- a scale borrowed from one unit and applied to another. */
  const lo = Math.min(...ranked.map(i => i.score), 0);
  const top_ = Math.max(...docs.map(d => d.best));
  const hi = top_ > lo ? top_ : lo + 1;
  /* Cross-encoder scores are single digits; fusion scores are thousandths, so
     two decimals renders the second as "+0.03" for everything. Precision is
     chosen from THIS RUN's scale, not from each value: keying it off the value
     printed a cross-encoder +0.9480 in the same column as +9.27, because 0.948
     is under 1 while belonging to the single-digit scale. A column that changes
     precision row by row reads as different quantities. */
  const dp = Math.max(Math.abs(lo), Math.abs(hi)) < 1 ? 4 : 2;
  const sig = v => v.toFixed(dp);
  /* The bar is scaled within this query, so on a decline -- where every score
     sits far below the threshold -- the best of a bad set would still fill it
     and read as confidence. The numbers already say rejected; the bar is
     dropped rather than allowed to contradict them. */
  const rows = docs.map(d => `
    <div class="row">
      <div class="name"><i style="background:${colour(d.source)}"></i>${esc(shortDoc(d.source))}</div>
      <div class="n">${d.n} psg</div>
      <div class="bar">${!declined ? `<i style="width:${Math.max(4, Math.round((d.best - lo) / (hi - lo) * 100))}%;
        background:${colour(d.source)}"></i>` : ""}</div>
      <div class="s">${d.best > 0 ? "+" : ""}${sig(d.best)}</div>
    </div>`).join("");

  const cand = ranked.map(i => `
    <tr class="${sel.some(s => s.chunk_id === i.chunk_id) ? "" : "out"}">
      <td class="r num">${i.rank}</td>
      <td><div class="src"><span class="dot" style="background:${colour(i.source)}"></span>${esc(shortDoc(i.source))}</div>
          <div class="loc">${esc(i.locator)}</div></td>
      <td><div class="snip">${esc(clean(i.text))}</div></td>
      <td class="r num">${typeof i.score === "number" ? i.score : ""}</td>
      <td class="r num">${i.delta > 0 ? "+" + i.delta : i.delta < 0 ? i.delta : "·"}</td>
    </tr>`).join("");

  /* Expansion is reported rather than shown. The blockquote is the passage the
     reranker scored, which is what the confidence figure refers to; substituting
     the grown text would put a number against text it was never measured on. */
  const cx = data.context || {};
  const grown = cx.mode && cx.mode !== "none"
    ? ` Each is then expanded to ${cx.mode === "page" ? "its whole page" : "its neighbouring chunks"}
        before being handed on — ${nf(cx.chars)} characters in ${cx.blocks} block${cx.blocks === 1 ? "" : "s"}.`
    : "";

  $("#answer").innerHTML = `
    <div class="verdict"><span class="v">${
        declined ? "Declined" : ungated ? "Returned, not gated" : "Answering"}</span>
      <span class="score">${ungated
        ? `top score ${v.confidence} on the fusion scale — not comparable to the threshold`
        : `${v.confidence > 0 ? "+" : ""}${v.confidence} against threshold ${v.threshold.toFixed(1)}`}</span>
    </div>
    ${ok ? `
      <blockquote>${esc(fragment(top.text))}</blockquote>
      <div class="credit"><i style="background:${colour(top.source)}"></i>
        ${esc(shortDoc(top.source))} · ${esc(top.locator)}</div>
      ${ungated ? `<p class="why">Reranking is off, so the abstention gate did not run —
        its threshold is calibrated on cross-encoder scores and none were computed. This is
        <b>the shortlist's best passage, not one the system vouched for</b>.</p>` : ""}
      <p class="why">Returned <b>verbatim</b>, not summarised, which is why it cannot invent
        anything.${grown} Writing these into prose is an optional layer that has never run here
        for want of API credit.</p>
    ` : `
      <blockquote style="font-size:19px">The corpus does not contain this.</blockquote>
      <p class="why">${esc(v.explanation)}</p>
      <p class="why">The passages below came closest and are shown as <b>rejected
        candidates</b>. Returning the nearest topical match to a question the corpus cannot
        answer is the failure this gate exists to prevent.</p>
    `}
    ${docs.length ? `<div class="lab" style="margin-top:26px">${
      declined ? "Closest, and rejected"
      : ungated ? "Documents returned" : "Documents that answered"}</div>
      <div class="rows">${rows}</div>` : ""}
    <details class="more">
      <summary>Every candidate weighed</summary>
      <p class="why">${ungated
        ? `All ${ranked.length} in the first stage's order — nothing rescored them.`
        : `All ${ranked.length} after reranking, in the cross-encoder's order.`}
        The ${sel.length} that survived are solid; the rest were dropped.</p>
      <div class="scroll"><table>
        <thead><tr><th class="r">#</th><th>Document</th><th>Passage</th>
          <th class="r">Score</th><th class="r">Move</th></tr></thead>
        <tbody>${cand}</tbody></table></div>
    </details>`;
}

/* ---------------------------------------------------------- settings
   These re-run the pipeline. That is the whole difference between an
   explanation and a bench: the aggregate numbers beside each option describe
   84 labelled cases and answer "is this better in general", and the comparison
   underneath describes the one question on screen and answers "did it change
   THIS result". A closed product can offer neither, because neither exists
   unless the stages are inspectable and the harness is yours.

   The aggregate figures are read from eval/results.json, never typed here: a
   hard-coded 0.848 goes stale the next time the harness runs and nobody
   notices. */
const DEFAULTS = { rerank: true, fusion: "rrf", max_per_source: 2, expansion: "window" };
let OPTS = { ...DEFAULTS };
const atDefaults = () => Object.keys(DEFAULTS).every(k => OPTS[k] === DEFAULTS[k]);

const GROUPS = [
  { key: "rerank", h: "Reranking", u: "MRR", opts: [
      ["On", true, ["end_to_end", "dense + rerank", "mrr"]],
      ["Off", false, ["end_to_end", "dense, no rerank", "mrr"]]] },
  { key: "fusion", h: "Fusion", u: "hit rate", opts: [
      ["RRF", "rrf", ["end_to_end", "rrf + rerank", "hit_rate"]],
      ["Weighted", "weighted", ["end_to_end", "weighted + rerank", "hit_rate"]],
      ["Dense", "none", ["end_to_end", "dense + rerank", "hit_rate"]]] },
  { key: "max_per_source", h: "Diversity cap", u: "source recall", opts: [
      ["2/src", 2, ["end_to_end", "+ diversity 2/src", "src_recall"]],
      ["1/src", 1, ["end_to_end", "+ diversity 1/src", "src_recall"]],
      ["None", null, ["end_to_end", "rrf + rerank", "src_recall"]]] },
  { key: "expansion", h: "Context", u: "context recall", opts: [
      ["Window", "window", ["expansion", "window +/-1", "context_recall"]],
      ["Page", "page", ["expansion", "page", "context_recall"]],
      ["None", "none", ["expansion", "none (chunks)", "context_recall"]]] },
];

function renderSettings() {
  const measured = path => {
    const v = path.reduce((o, k) => (o == null ? o : o[k]), EVAL);
    return v == null ? "—" : v.toFixed(3);
  };
  /* retrieve() applies the cap only on the reranked path, so with reranking off
     this control genuinely does nothing. Dimming it and saying why beats
     leaving a live-looking button that changes no result. */
  const inert = key => key === "max_per_source" && OPTS.rerank === false;

  $("#settings").innerHTML = GROUPS.map(g => `
    <div class="setting${inert(g.key) ? " inert" : ""}">
      <div class="top"><h3>${g.h}</h3><span class="lab unit">${g.u}</span></div>
      <div class="opts">${g.opts.map(([label, value, path]) => `
        <button class="opt" type="button" aria-pressed="${OPTS[g.key] === value}"
                data-k="${g.key}" data-v="${encodeURIComponent(JSON.stringify(value))}">
          <span class="k">${label}</span><span class="v">${measured(path)}</span></button>`).join("")}</div>
      ${inert(g.key) ? `<p class="inertnote">The cap trims a reranked pool, so this path
        never reaches it. Turn reranking back on to use it.</p>` : ""}
    </div>`).join("");

  $("#settings").querySelectorAll(".opt").forEach(b => {
    b.onclick = () => {
      const value = JSON.parse(decodeURIComponent(b.dataset.v));
      if (OPTS[b.dataset.k] === value) return;
      OPTS[b.dataset.k] = value;
      renderSettings();
      rerun();
    };
  });
  $("#reset").classList.toggle("hide", atDefaults());
}

$("#reset").onclick = () => { OPTS = { ...DEFAULTS }; renderSettings(); rerun(); };

/* ------------------------------------------------------- the comparison
   Defaults against the current settings, on the question on screen. Only the
   things that actually moved: a table of five rows where four read "unchanged"
   trains the eye to skip the one that did not. */
function renderCompare() {
  const el = $("#compare");
  if (!BASE || !LAST) { el.innerHTML = ""; return; }
  if (LAST === BASE) {
    el.innerHTML = `<span class="lab">at defaults</span> &nbsp;Change any setting above to
      re-run this question and compare against them.`;
    return;
  }

  const items = t => t.stages[t.stages.length - 1].items;
  const a = items(BASE), b = items(LAST);
  const aIds = new Set(a.map(i => i.chunk_id));
  const kept = b.filter(i => aIds.has(i.chunk_id)).length;
  const docs = t => new Set(items(t).map(i => i.source)).size;
  const conf = t => t.verdict.confident === null ? "no gate"
    : `${t.verdict.confidence > 0 ? "+" : ""}${t.verdict.confidence}`;
  const cite = t => items(t).length
    ? `${shortDoc(items(t)[0].source)} · ${items(t)[0].locator}` : "—";

  const rows = [
    ["top passage", cite(BASE), cite(LAST)],
    /* Written so the row-is-identical filter below can drop it: "5" against
       "5 of 5 the same" would never compare equal, and a row that always
       appears teaches the eye to stop reading the table. */
    ["passages", `${a.length}`,
     kept === b.length && a.length === b.length ? `${b.length}`
       : `${b.length}, ${b.length - kept} new`],
    ["documents", `${docs(BASE)}`, `${docs(LAST)}`],
    ["confidence", conf(BASE), conf(LAST)],
    ["context", `${nf(BASE.context.chars)} ch`, `${nf(LAST.context.chars)} ch`],
    /* Latency is a real cost of reranking -- an 8x reranker was rejected over
       it -- but two traces of the same query vary by a few ms either way, and
       a 38-vs-35 row presented as a delta is noise wearing a measurement's
       clothes. Reported only when the difference outruns that. */
    ...(Math.max(BASE.ms, LAST.ms) > 1.25 * Math.min(BASE.ms, LAST.ms)
      ? [["took", `${BASE.ms.toFixed(0)}ms`, `${LAST.ms.toFixed(0)}ms`]] : []),
  ].filter(([, x, y]) => x !== y);

  el.innerHTML = `<span class="lab">this question, defaults vs now</span>
    ${rows.length ? `<table>
      <thead><tr><th></th><th class="r">default</th><th class="r">now</th></tr></thead>
      <tbody>${rows.map(([k, x, y]) => `<tr><td>${esc(k)}</td>
        <td class="r num">${esc(x)}</td><td class="r num">${esc(y)}</td></tr>`).join("")}
      </tbody></table>`
    : `<p class="why" style="margin-top:6px">Nothing measurable changed — this question
        returns the same passages either way. Worth knowing: a setting that helps across
        84 cases need not move any single one.</p>`}`;
}

/* -------------------------------------------------------- inspection */
function renderStages(data) {
  $("#stages").innerHTML = data.stages.map((s, n) => `
    <details class="stage">
      <summary><span class="lab num">${String(n + 1).padStart(2, "0")}</span>
        <span><span class="t">${esc(s.title)}</span>
          <span class="lab note">${esc(s.note)}</span></span></summary>
      <div class="body">
        <p>${esc(s.detail)}</p>
        <div class="scroll"><table>
          <thead><tr><th class="r">#</th><th>Document</th><th>Passage</th><th class="r">Score</th></tr></thead>
          <tbody>${s.items.slice(0, 8).map(i => `
            <tr><td class="r num">${i.rank}</td>
              <td><div class="src"><span class="dot" style="background:${RUN.colour(i.source)}"></span>${esc(shortDoc(i.source))}</div>
                  <div class="loc">${esc(i.locator)}</div></td>
              <td><div class="snip">${esc(clean(i.text))}</div></td>
              <td class="r num">${typeof i.score === "number" ? i.score : ""}</td></tr>`).join("")}
          </tbody></table></div>
      </div>
    </details>`).join("");
}
</script>
</body>
</html>
