<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline map — prototype</title>
<style>
:root{
  --ground:#F6F7F9; --panel:#FFFFFF; --sunk:#EDEFF3;
  --ink:#151A21; --muted:#5D6875; --faint:#8A94A1;
  --line:#DFE3E9; --line-soft:#EAEDF1;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-other:#8A94A1;
  --good:#0ca30c; --critical:#d03b3b;
  --serif:"Iowan Old Style",Charter,Cambria,"Palatino Linotype",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1216; --panel:#151A20; --sunk:#1B2128;
  --ink:#E7EBEF; --muted:#95A0AD; --faint:#6C7885;
  --line:#242C35; --line-soft:#1E252D;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-other:#6C7885;
}}
:root[data-theme="dark"]{
  --ground:#0E1216; --panel:#151A20; --sunk:#1B2128;
  --ink:#E7EBEF; --muted:#95A0AD; --faint:#6C7885;
  --line:#242C35; --line-soft:#1E252D;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-other:#6C7885;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px}
.wrap{max-width:1240px;margin:0 auto;padding:28px 28px 80px}
h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:0 0 4px;letter-spacing:-.012em}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin:0 0 6px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0 18px;
  padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:3px}
.bar input[type=text]{flex:1;min-width:260px;padding:9px 12px;border:1px solid var(--line);
  border-radius:3px;background:var(--ground);color:var(--ink);font:inherit;font-size:14px}
.bar button{border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:3px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.bar button.go{background:var(--ink);color:var(--ground);border-color:transparent;font-weight:600}
.bar input[type=range]{width:220px;accent-color:var(--series-1)}
.bar label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint)}
figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:3px;
  padding:0;overflow:hidden}
.stagebar{display:flex;border-bottom:1px solid var(--line-soft)}
.stagebar div{flex:1;padding:11px 12px;border-right:1px solid var(--line-soft)}
.stagebar div:last-child{border-right:0}
.stagebar b{display:block;font-family:var(--serif);font-size:14px;font-weight:600}
.stagebar i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px}
.stagebar span{font-family:var(--mono);font-size:10.5px;color:var(--faint);
  letter-spacing:.05em;display:block;margin-top:2px}
canvas{display:block;width:100%;height:430px}
.caption{border-top:1px solid var(--line-soft);padding:14px 16px;color:var(--muted);
  font-size:13.5px;min-height:52px}
.caption b{color:var(--ink);font-weight:600}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:10px}
.note{color:var(--muted);font-size:13.5px;max-width:74ch;margin:16px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">prototype · not the shipping page</p>
  <h1>Pipeline map</h1>
  <p class="note">The bump chart rebuilt as a place. Stages are platforms, rank is vertical
    position within a platform, height is score, ribbons are passages. Dense and BM25 sit on
    the same step because they run at the same moment.</p>

  <div class="bar">
    <input type="text" id="q" value="What BLEU score did the Transformer achieve on WMT 2014 English-to-German?">
    <button class="go" id="go" type="button">Trace</button>
    <button id="refuse" type="button">Unanswerable</button>
    <button id="themer" type="button">Theme</button>
  </div>
  <div class="bar">
    <button id="play" type="button">Replay</button>
    <label for="p">Stage</label>
    <input type="range" id="p" min="0" max="100" value="100">
    <span class="meta" id="pv">100%</span>
    <span style="flex:1"></span>
    <span class="meta" id="elapsed"></span>
  </div>

  <figure>
    <div class="stagebar" id="stagebar"></div>
    <canvas id="c"></canvas>
    <div class="caption" id="cap">Trace a question to draw the map.</div>
  </figure>
</div>

<script type="module">
import { buildScene, drawScene, captions } from "/pipeline-map.js";

const $ = s => document.querySelector(s);
const cv = $("#c"), ctx = cv.getContext("2d");
let CORPUS = null, SCENE = null, INK = null;
const REPLAY_MS_TOTAL = 7500;   // the replay is a replay, not a progress bar

const readInk = () => {
  const cs = getComputedStyle(document.body);
  const v = n => cs.getPropertyValue(n).trim();
  return { ink:v("--ink"), muted:v("--muted"), faint:v("--faint"), line:v("--line"),
    lineSoft:v("--line-soft"), panel:v("--panel"), sunk:v("--sunk"),
    s1:v("--series-1"), s2:v("--series-2"), s3:v("--series-3"),
    other:v("--series-other"), good:v("--good"), critical:v("--critical") };
};

function size() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { w: r.width, h: r.height };
}

function render() {
  const { w, h } = size();
  if (!SCENE) { ctx.clearRect(0, 0, w, h); return; }
  drawScene(ctx, SCENE, INK, w, h, Number($("#p").value) / 100);
}

fetch("/api/corpus").then(r => r.json()).then(c => { CORPUS = c; });

async function trace(q) {
  $("#cap").textContent = "Running…";
  const t0 = performance.now();
  const r = await fetch("/api/trace", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: q }),
  });
  const data = await r.json();
  const ms = performance.now() - t0;   // request only, not page load
  INK = readInk();
  SCENE = buildScene(data, CORPUS, INK);
  $("#elapsed").textContent =
    `round trip ${ms.toFixed(0)} ms · replayed ${(REPLAY_MS_TOTAL / ms).toFixed(0)}× slower`;
  // Stage names live on the canvas now; this strip carries document identity,
  // which colour alone must never do.
  // On a decline nothing reached an answer, so the legend must not say it did.
  // The documents keep their colours -- you can still see which came closest --
  // but the caption is the difference between "returned" and "rejected".
  const reached = SCENE.confident ? "reached the answer" : "came closest · rejected";
  $("#stagebar").innerHTML = SCENE.order.map(d =>
    `<div><b><i style="background:${SCENE.colour(d)}"></i>${d.replace(/\.pdf$/, "")}</b>` +
    `<span>${reached}</span></div>`).join("")
    || `<div><b>Nothing survived</b><span>the gate stayed shut</span></div>`;
  const v = SCENE.verdict;
  play();
}

$("#go").onclick = () => trace($("#q").value.trim());
$("#refuse").onclick = () => {
  $("#q").value = "What is the airspeed velocity of an unladen swallow?";
  trace($("#q").value);
};
/* ------------------------------------------------------------ playback
   The pipeline finished in ~60 ms, so this is a replay, not a progress bar.
   It plays once and rests on the whole figure -- the settled state is a
   diagram you can read, not a frame you happened to stop on. */
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let raf = 0, playing = false;

function setProgress(v, updateSlider = true) {
  // Clamped at the door. requestAnimationFrame hands back the timestamp of the
  // frame that had already begun, which can precede the performance.now() the
  // clock started from -- so the first frame's progress can be negative, and an
  // unclamped index reaches caps[-1]. It fires intermittently, which is worse
  // than always.
  v = Math.max(0, Math.min(1, v));
  if (updateSlider) $("#p").value = Math.round(v * 100);
  $("#pv").textContent = Math.round(v * 100) + "%";
  render();
  if (!SCENE) return;
  const caps = captions(SCENE);
  const c = caps[Math.max(0, Math.min(caps.length - 1, Math.floor(v * caps.length)))];
  $("#cap").innerHTML = `<b>${c.title}.</b> ${c.text}`;
}

function stop() { playing = false; cancelAnimationFrame(raf); $("#play").textContent = "Replay"; }

function play() {
  if (!SCENE) return;
  stop();
  if (reduced()) { setProgress(1); return; }   // no motion: show the settled figure
  playing = true;
  $("#play").textContent = "Playing…";
  const t0 = performance.now();
  const step = now => {
    if (!playing) return;
    const v = Math.min(1, (now - t0) / REPLAY_MS_TOTAL);
    setProgress(v);
    if (v < 1) raf = requestAnimationFrame(step);
    else stop();
  };
  raf = requestAnimationFrame(step);
}

// Touching the scrubber takes over from the replay rather than fighting it.
$("#p").oninput = e => { stop(); setProgress(Number(e.target.value) / 100, false); };
$("#play").onclick = play;
$("#themer").onclick = () => {
  const now = document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", now === "dark" ? "light" : "dark");
  if (SCENE) { INK = readInk(); SCENE = null; trace($("#q").value); }
};
addEventListener("resize", render);
trace($("#q").value);
</script>
</body>
</html>
