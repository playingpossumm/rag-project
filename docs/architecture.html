<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Architecture — rag-project</title>
<style>
:root{
  --ground:#F6F7F9; --panel:#FFFFFF; --sunk:#EDEFF3;
  --ink:#151A21; --muted:#5D6875; --faint:#8A94A1;
  --line:#DFE3E9; --line-soft:#EAEDF1;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
  --accent-wash:#DCEAFA;
  --serif:"Iowan Old Style",Charter,Cambria,"Palatino Linotype",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1216; --panel:#151A20; --sunk:#1B2128;
  --ink:#E7EBEF; --muted:#95A0AD; --faint:#6C7885;
  --line:#242C35; --line-soft:#1E252D;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
  --accent-wash:#17293E;
}}
:root[data-theme="dark"]{
  --ground:#0E1216; --panel:#151A20; --sunk:#1B2128;
  --ink:#E7EBEF; --muted:#95A0AD; --faint:#6C7885;
  --line:#242C35; --line-soft:#1E252D;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
  --accent-wash:#17293E;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--panel);color:var(--ink);
  font-family:var(--sans);overflow:hidden}
select{font:inherit}
/* The one stylesheet the map needs: the dash march along the active flow edge.
   -18px is one full dasharray period (10 8), so the loop is seamless.
   Import once, anywhere the map is mounted. */
@keyframes am-dash {
  to {
    stroke-dashoffset: -18px;
  }
}

@media (prefers-reduced-motion: reduce) {
  [style*="am-dash"] {
    animation: none !important;
  }
}
</style>
</head>

uctured data]], never printed, so a caller can render it, store it, or diff two runs.",howItsBuilt:"Retrieval-only by default: returning the source text verbatim costs nothing and cannot hallucinate, so the system stays fully usable with no API key and no spend. Generation is an optional layer on top rather than a dependency.",files:["src/api.py"],stack:["sentence-transformers","FAISS"]},{id:"serve",code:"SV",name:"HTTP server",role:"the local server",group:"entry",whatItDoes:"Serves two audiences from one process: POST /ask for another tool to embed, and the [[Retrieval Inspector]] at /, which runs the same pipeline but shows every intermediate ranking instead of only the five passages that survived.",howItsBuilt:"Standard library, not FastAPI. This is a thin adapter \u2014 parse JSON, call one function, serialise \u2014 and a web framework plus an ASGI server would be two more dependencies to pin and carry for no behaviour a caller can see. Binds to 127.0.0.1 deliberately: the corpus may hold private documents, so exposing it has to be an act.",files:["src/serve.py"],stack:["http.server","ThreadingHTTPServer"]},{id:"cli",code:"CL",name:"Command line",role:"the terminal shell",group:"entry",whatItDoes:"Asks a question from a terminal. Readable output by default, JSON when piped somewhere that wants to parse it.",howItsBuilt:"The third and last shell over ask(). Library, HTTP and CLI all call the same function, so the three interfaces cannot drift apart in behaviour.",files:["src/cli.py"]},{id:"trace",code:"TR",name:"Pipeline trace",role:"the flight recorder",group:"entry",whatItDoes:"Re-runs retrieval keeping every intermediate ranking \u2014 which retriever found what, how fusion reconciled two disagreeing orders, what the reranker promoted or buried, which passages the diversity cap displaced. It is what makes [[\u201Cwhy did it return that?\u201D]] an answerable question.",howItsBuilt:"A deliberate duplicate of the pipeline rather than debug flags threaded through retrieve(): a serving path that carries debug state is one that eventually ships it, and the two have opposite goals \u2014 one wants to be fast and forget, this one wants to be slow and remember. This file claimed for months that a test held the two together; the test did not exist, and the duplication was held together by care alone. It exists now, and it earns its keep: retrieve() takes a different path when reranking is off \u2014 shortlisting k rather than candidate_k, and skipping the diversity cap \u2014 and the trace had to be taught the same, or it would have drawn a pool and a cap the serving path never ran.",files:["src/pipeline_trace.py","src/test_trace.py"]},{id:"ingest",code:"IN",name:"Index builder",role:"the assembly line",group:"ingestion",whatItDoes:"Walks the corpus folder and turns documents into a searchable index: parse, check, chunk, embed, write FAISS. Emits [[structured progress events]] as it goes, which is what lets the Inspector show a live re-index without a second code path.",howItsBuilt:"Chunks are measured in tokens, not words, because the encoder's ceiling is a token count. Sizing in words let chunks reach ~1,200 tokens and everything past 256 was silently dropped before the encoder saw it \u2014 stored and citable, but invisible to search. Now 210 tokens with an assertion that refuses to build an index if any chunk exceeds the ceiling.",files:["src/ingest.py"],stack:["FAISS","NumPy","sentence-transformers"]},{id:"loaders",code:"LD",name:"Format desk",role:"the parser dispatch",group:"ingestion",whatItDoes:"Reads PDF, Word, PowerPoint and Excel, and gives each one a citation locator its own format can honour: a PDF cites a page, PowerPoint a slide, Excel a sheet and row range, Word a [[section]].",howItsBuilt:"Word is the awkward one and drove the design. A .docx has no fixed pages \u2014 pagination is computed by the renderer and shifts with fonts and margins \u2014 so any page number would be wrong on the reader's copy. Sections are the unit that actually exists in the file. Note: only the PDF path has ever run on real files.",files:["src/loaders.py"],stack:["pymupdf4llm","python-docx","python-pptx","openpyxl"]},{id:"ocr",code:"OC",name:"OCR fallback",role:"the last resort",group:"ingestion",whatItDoes:"Rescues pages that have no extractable text layer \u2014 scanned exhibits, a contract whose signature pages were scanned back in.",howItsBuilt:"Applied [[per page, not per document]]. The common real case is mixed, and running OCR across a whole document to rescue three pages would be slow and would also *degrade* the good pages, since OCR output is worse than a real text layer. Extraction stays primary; OCR only fills the gaps it leaves. Never run on real files.",files:["src/ocr.py"],stack:["RapidOCR","PyMuPDF"]},{id:"health",code:"HL",name:"Corpus health",role:"the gatekeeper",group:"ingestion",whatItDoes:"Decides, before anything is embedded, whether a document will index badly \u2014 and excludes it loudly rather than letting it in quietly.",howItsBuilt:"Exists because the failure it prevents is [[silent]]. A scanned PDF has no text layer, so the extractor returns an empty string rather than an error: the page is chunked into nothing, embedded into nothing, and simply never retrieved. Evaluation keeps producing confident numbers, computed over a corpus with holes in it.",files:["src/corpus_health.py"]},{id:"fetch",code:"FC",name:"Corpus fetcher",role:"the sample corpus",group:"ingestion",whatItDoes:"Downloads twenty ML and NLP papers from arXiv so the system has something real to be measured against.",howItsBuilt:"The papers are [[topically adjacent on purpose]]. A corpus drawn from different fields would make retrieval and abstention look good for the wrong reason \u2014 telling physics from poetry is easy. Papers that all discuss transformers and training procedures force the retriever to separate genuinely similar sources.",files:["src/fetch_corpus.py"]},{id:"parsecache",code:"PC",name:"Parse cache",role:"the parse memo",group:"caching",whatItDoes:"Remembers the parsed units of every document, so re-indexing an unchanged folder does not re-read a single PDF.",howItsBuilt:"Keyed on a hash of the file's [[bytes]], not its path or modification time. A moved or renamed file is recognised as the same content, so reorganising a folder does not trigger a full re-parse. Built because removing the embedding cost exposed parsing as the new bottleneck \u2014 300 of the remaining 432 seconds.",files:["src/parse_cache.py"]},{id:"embedcache",code:"EC",name:"Embedding cache",role:"the vector memo",group:"caching",whatItDoes:"Stores every chunk embedding against a hash of its text and model, so adding one document to twenty does not re-embed the other twenty.",howItsBuilt:"Embeddings are a [[pure function]] of (text, model), so they cache perfectly. Keying on both means an edited document re-embeds only the chunks that actually changed, and switching models invalidates cleanly instead of silently mixing vector spaces. Together with the parse cache this is what makes a no-op re-index 0.76 s against a 432 s cold build.",files:["src/embedding_cache.py"],stack:["NumPy"]},{id:"retrieve",code:"RT",name:"Retrieve",role:"the conductor",group:"retrieval",whatItDoes:"Runs the pipeline in order: shortlist by dense and sparse search, fuse, rerank, cap per document, expand to context. The five passages that come out are the answer.",howItsBuilt:"Over-retrieves on purpose \u2014 a [[candidate pool of 20]] for a top-5 answer. The reranker only reorders what the first stage hands it, so a relevant chunk missing from the candidate set can never be recovered; that trades a little latency for recall headroom.",files:["src/retrieve.py"],stack:["FAISS IndexFlatIP","all-MiniLM-L6-v2"]},{id:"hybrid",code:"HY",name:"BM25 & fusion",role:"the second opinion",group:"retrieval",whatItDoes:"Adds a keyword retriever alongside the vector one and reconciles the two rankings. Worth +7.6 points of hit rate over dense alone.",howItsBuilt:"Fuses on [[rank, never score]]. A cosine similarity and a BM25 score live on incomparable scales, so anything that adds them needs per-query normalisation \u2014 which is relative, so a query where every candidate is mediocre still yields a top score of 1.0. RRF uses position only: scale-free, with nothing to tune.",files:["src/hybrid.py"],stack:["rank_bm25"]},{id:"rerank",code:"RR",name:"Cross-encoder",role:"the close reader",group:"retrieval",whatItDoes:"Re-scores the shortlist by reading the question and the passage [[together]] in one pass. Lifts MRR from 0.601 to 0.710 \u2014 and leaves hit rate flat, which is the point of measuring both.",howItsBuilt:"Kept at MiniLM-L6 after the obvious upgrade was measured and rejected: an 8\xD7 larger model (BGE, 278M) fixed the *same* 2 of 10 failing cases at 10 s/query. Capacity is not the bottleneck \u2014 the failures are contrastive clauses, and negation is a known transformer weakness that scale does not resolve.",files:["src/rerank.py"],stack:["cross-encoder/ms-marco-MiniLM-L-6-v2"]},{id:"diversify",code:"DV",name:"Diversity cap",role:"the spread",group:"retrieval",whatItDoes:"Takes at most two passages from any one document, so an answer that lives in five papers comes back from five papers.",howItsBuilt:"A per-document cap rather than [[MMR]]: MMR diversifies on embedding distance, which conflates similar wording with same source and needs a lambda tuned per corpus. Here the unit of redundancy is known exactly \u2014 it is the document. It is a trade, not a free win: +3.1 source recall for \u22121.6 any-hit. An earlier, smaller golden set said it was free; that was wrong.",files:["src/diversify.py"]},{id:"parent",code:"PR",name:"Context expansion",role:"the widener",group:"retrieval",whatItDoes:"Ranks on small chunks but returns bigger context around each hit, so an answer is not cut off mid-argument.",howItsBuilt:"Chunk size sits under opposing pressures \u2014 small chunks rank better, large chunks read better \u2014 so the two are separated rather than compromised. [[Window \xB11]] is the default: it reaches 0.833 context recall for half the tokens page expansion needs. That reversed an earlier conclusion that window was strictly dominated.",files:["src/parent.py"]},{id:"abstain",code:"AB",name:"Abstention gate",role:"the refusal",group:"retrieval",whatItDoes:"Decides whether the corpus can answer at all, and declines when it cannot \u2014 the behaviour a closed product structurally will not offer.",howItsBuilt:'Nearest-neighbour search has no notion of "nothing here": ask about a topic the corpus has never heard of and it still returns its five least-unrelated chunks, at scores indistinguishable from a real match. The cross-encoder scores differently, so the gate reads *its* score. The threshold is [[0.0]], and the distributions overlap \u2014 a deliberate trade, recalibrated three times, not a clean split.',files:["src/abstain.py"]},{id:"generate",code:"GN",name:"Generation",role:"the unproven layer",group:"retrieval",whatItDoes:"The optional step that would turn retrieved passages into a written answer with inline citations. Everything else works without it.",howItsBuilt:"Written but never executed \u2014 the account has no credit, so no call has ever completed. Two things follow: the code is evidence-free, and api.py reaches for it with [[from generate_answer import synthesize]], a module that does not exist (the module is generate.py, and it has no synthesize). A lazy import inside the optional branch is why nothing has ever raised.",files:["src/generate.py"],stack:["anthropic","claude-opus-5"]},{id:"evaluate",code:"EV",name:"Eval harness",role:"the scoreboard",group:"evaluation",whatItDoes:"Scores retrieval configurations against the labelled set and writes every number the README quotes. Reports hit rate, MRR, NDCG, source recall and context recall, because a change can move one and not the others.",howItsBuilt:"Relevance is judged at [[page level]], not chunk level: coarser than ideal, but it is the granularity a human can label reliably and it stays stable when chunking parameters change. Its own NDCG once printed 1.373 \u2014 impossible for a normalised metric \u2014 because several returned chunks shared one gold page. Caught only because the number violated a bound the metric is known to have. A companion script writes the same run out case by case rather than in aggregate, which is what makes [[\u201Cwhich cases did this break?\u201D]] answerable \u2014 and which immediately showed that the configuration documented as the default is measured on the weighted fusion branch while the app serves RRF.",files:["src/evaluate.py","src/per_case.py"]},{id:"goldenset",code:"GS",name:"Golden set",role:"the labels",group:"evaluation",whatItDoes:"Builds and audits the 84 labelled cases everything is measured against, and checks that each answer string actually occurs in the corpus [[as parsed]] rather than as the PDF renders it.",howItsBuilt:"Labels are derived, not written. Each case declares a distinctive answer string and every location containing it *becomes* gold, so labels cannot drift from the corpus. That rule earned itself: when the corpus grew from 1 document to 20, twelve of sixteen adversarial cases had silently become answerable and nothing errored.",files:["src/build_golden_set.py","src/audit_golden_set.py","src/check_answers.py","src/verify_candidates.py","src/label_multisource.py"]},{id:"probes",code:"PB",name:"Investigations",role:"the diagnostics",group:"evaluation",whatItDoes:"One-off scripts written to settle a specific question with a measurement instead of an argument: where cross-document confusion actually happens, whether a bigger reranker fixes it, what reranking changes on a single query.",howItsBuilt:"Each exists because one anecdote is not a problem statement. diagnose_crossdoc classifies every failing case by *where* it fails, because the three modes need diffe
